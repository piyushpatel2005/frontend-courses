<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 629" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">State Before the View</title>
<desc id="figure-desc">State Before the View. Update Button: Change bookings[0].time. bookings Array: The source of truth keeps the new time. paint(): Clear old rows; append safe rows
from the current array. Clearing DOM children does not clear the array. Repeated rendering should not duplicate rows.</desc>
