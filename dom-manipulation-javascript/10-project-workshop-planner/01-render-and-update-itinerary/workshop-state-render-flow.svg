</text>
<text x="240" y="405.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Clear old rows; append safe rows</tspan>
<tspan x="240" dy="18.4">from the current array.</tspan>
</text>
<text x="240" y="505.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Clearing DOM children does not clear the array.</tspan>
<tspan x="240" dy="18.4">Repeated rendering should not duplicate rows.</tspan>
