<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 782 497" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Remove the clicked source index</title>
<desc id="figure-desc">A cloud filter hides Garden calendar but leaves its position in holds. Clicking Cloud journal at all-rows index 2 removes holds[2], not the first matching title.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="782" height="497" fill="#ffffff" />
<rect x="25" y="80" width="700" height="250" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
<rect x="55" y="145" width="485" height="45" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="55" y="204" width="485" height="45" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" />
<rect x="55" y="263" width="485" height="45" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<text x="24" y="37.14" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="24">Filter hides rows; removal changes source state</tspan>
</text>
<text x="43" y="108.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="43">holds array / list.children (same order)</tspan>
</text>
<text x="72" y="169.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="72">[0] Atlas of clouds  ·  visible</tspan>
</text>
<text x="72" y="228.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="72">[1] Garden calendar  ·  hidden</tspan>
</text>
<text x="72" y="287.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="72">[2] Cloud journal  ·  clicked</tspan>
</text>
<text x="550" y="280.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="550">indexOf(row)</tspan>
</text>
<text x="550" y="303.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="550">→ 2</tspan>
</text>
<text x="36" y="379.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="36">holds.splice(2, 1) → [Atlas of clouds, Garden calendar]</tspan>
</text>
<text x="36" y="415.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="36">Render again with the same query: only Atlas of clouds is visible.</tspan>
</text>
</svg>