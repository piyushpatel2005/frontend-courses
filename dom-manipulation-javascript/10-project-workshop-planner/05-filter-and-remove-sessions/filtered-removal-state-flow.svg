<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-labelledby="title desc">
<title id="title">Remove by Position, Not by Title</title><desc id="desc">A clicked library hold row has an index among all rows, including hidden rows. Remove the corresponding source entry before rendering again.</desc>
<rect width="840" height="280" rx="18" fill="#fffdf6"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#253e67"/></marker></defs>
<text x="420" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#24334b">Remove by Position, Not by Title</text>
<rect x="30" y="72" width="220" height="110" rx="12" fill="#a5d8ff" stroke="#253e67" stroke-width="2"/>
<text x="140" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Clicked Hold Row</text>
<text x="140" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Find its row index</text>
<path d="M250 127 H310" stroke="#253e67" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="310" y="72" width="220" height="110" rx="12" fill="#fff3bf" stroke="#253e67" stroke-width="2"/>
<text x="420" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">holds.splice(index, 1)</text>
<text x="420" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Remove one entry</text>
<path d="M530 127 H590" stroke="#253e67" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="590" y="72" width="220" height="110" rx="12" fill="#b2f2bb" stroke="#253e67" stroke-width="2"/>
<text x="700" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">render()</text>
<text x="700" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Reapply query + count</text>
<text x="420" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#24334b">Hidden rows keep their positions. Duplicate titles can be separate holds.</text>
</svg>
