<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 629" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Safe Additions and Removal</title>
<desc id="figure-desc">Safe Additions and Removal. Form Submit: Trim and validate the tool name. Prepare and Append a Row: Literal text plus a native Remove button. A Later Remove Click: One listener on #tools handles
original and newly added rows. Use textContent for the submitted name. Removing one row leaves the other rows intact.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="629" fill="#ffffff"/>
<path d="M240 188.5 L240 222.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 311.5 L240 345.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="20" y="100" width="440" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="20" y="223" width="440" height="88" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="20" y="346" width="440" height="111" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Safe Additions and Removal</tspan>
</text>
<text x="240" y="130.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Form Submit</tspan>
</text>
<text x="240" y="159.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Trim and validate the tool name.</tspan>
</text>
<text x="240" y="253.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Prepare and Append a Row</tspan>
</text>
<text x="240" y="282.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Literal text plus a native Remove button.</tspan>
</text>
<text x="240" y="376.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">A Later Remove Click</tspan>
</text>
<text x="240" y="405.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">One listener on #tools handles</tspan>
<tspan x="240" dy="18.4">original and newly added rows.</tspan>
</text>
<text x="240" y="505.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Use textContent for the submitted name.</tspan>
<tspan x="240" dy="18.4">Removing one row leaves the other rows intact.</tspan>
</text>
