<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop sessions</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Workshop sessions</h1>
    <table>
      <caption>Upcoming sessions</caption>
      <thead><tr><th id="session-heading" scope="col" aria-sort="none"><button id="sort-sessions" type="button">Sort by session</button></th><th scope="col">Room</th></tr></thead>
      <tbody id="sessions">
        <tr><td>Printmaking</td><td>Studio</td></tr>
        <tr><td>Bookbinding</td><td>Library</td></tr>
        <tr><td>Clay</td><td>Workshop</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
