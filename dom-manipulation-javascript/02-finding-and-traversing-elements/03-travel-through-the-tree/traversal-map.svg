<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 812 502" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Navigate the book card DOM</title>
<desc id="figure-desc">The featured span is a direct child of the article. parentElement and closest article reach that ancestor; children[0] reaches h2.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="812" height="502" fill="#ffffff" />
<rect x="70" y="104" width="630" height="300" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
<rect x="116" y="195" width="240" height="65" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="418" y="195" width="240" height="65" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
<path d="M659 225 L679 225 L679 105" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<text x="36" y="45.88" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="36">Navigate the book card DOM</tspan>
</text>
<text x="95" y="131.53" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
<tspan x="95">article.card  ← label.closest("article")</tspan>
</text>
<text x="132" y="227.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="132">h2  River atlas</tspan>
</text>
<text x="434" y="225.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="434">span.featured  Staff pick</tspan>
</text>
<text x="126" y="303.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="126">children[0] → h2</tspan>
</text>
<text x="429" y="303.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="429">label = .featured</tspan>
</text>
<text x="560" y="168.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="560">parentElement</tspan>
</text>
<text x="95" y="364.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="95">Both are direct element children; whitespace text is skipped by children.</tspan>
</text>
</svg>