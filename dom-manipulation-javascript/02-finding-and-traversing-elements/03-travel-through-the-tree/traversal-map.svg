<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
<title id="title">Routes Around A Book Card</title><desc id="desc">Three example routes: featured span parentElement reaches article; featured span closest article reaches article; article children zero reaches the heading.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker></defs>
<rect width="800" height="440" rx="16" fill="#fcfaf5"/>
<g font-family="system-ui, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="400.0" y="38" font-size="24" font-weight="700">Routes Around A Book Card</text>
<rect x="35" y="85" width="430" height="75" rx="10" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="250.0" y="108.5" dominant-baseline="middle" font-size="18">Start at span.featured</text><text x="250.0" y="136.5" dominant-baseline="middle" font-size="18">label.parentElement</text><path d="M465 122.5 L540 122.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="85" width="225" height="75" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="652.5" y="122.5" dominant-baseline="middle" font-size="18">article.card</text><rect x="35" y="190" width="430" height="75" rx="10" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="250.0" y="213.5" dominant-baseline="middle" font-size="18">Start at span.featured</text><text x="250.0" y="241.5" dominant-baseline="middle" font-size="18">label.closest(&quot;article&quot;)</text><path d="M465 227.5 L540 227.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="190" width="225" height="75" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="652.5" y="227.5" dominant-baseline="middle" font-size="18">article.card</text><rect x="35" y="295" width="430" height="75" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="250.0" y="318.5" dominant-baseline="middle" font-size="18">Start at article.card</text><text x="250.0" y="346.5" dominant-baseline="middle" font-size="18">card.children[0]</text><path d="M465 332.5 L540 332.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="295" width="225" height="75" rx="10" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/><text x="652.5" y="318.5" dominant-baseline="middle" font-size="18">h2</text><text x="652.5" y="346.5" dominant-baseline="middle" font-size="18">River atlas</text><text x="400" y="410" font-size="18">The span and heading are direct children of the article in this example.</text></g></svg>
