<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 692 442" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">One append, two collection snapshots</title>
<desc id="figure-desc">Both collections initially match Frog and Dragonfly; after Heron is appended, the live HTMLCollection includes it while the earlier static NodeList does not.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="692" height="442" fill="#ffffff" />
<rect x="25" y="83" width="285" height="222" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<rect x="350" y="83" width="285" height="222" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<text x="25" y="37.14" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="25">After appending &lt;li class="sighting"&gt;Heron&lt;/li&gt;</tspan>
</text>
<text x="42" y="114.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="42">LIVE HTMLCollection</tspan>
</text>
<text x="42" y="152.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="42">Frog</tspan>
</text>
<text x="42" y="190.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="42">Dragonfly</tspan>
</text>
<text x="42" y="228.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="42">Heron  ← newly included</tspan>
</text>
<text x="42" y="280.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="42">length = 3</tspan>
</text>
<text x="367" y="114.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
