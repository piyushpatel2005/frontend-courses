<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Live Membership And A Static List</title><desc id="desc">After Heron is appended the live collection has three elements and the earlier static list still has two.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker></defs>
<rect width="800" height="450" rx="16" fill="#fcfaf5"/>
<g font-family="system-ui, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="400.0" y="38" font-size="24" font-weight="700">Live Membership And A Static List</text>
<text x="400" y="77" font-size="18">Both queries run before the new matching row is appended.</text><rect x="40" y="110" width="310" height="85" rx="10" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="195.0" y="138.5" dominant-baseline="middle" font-size="18">Live HTMLCollection</text><text x="195.0" y="166.5" dominant-baseline="middle" font-size="18">Frog · Dragonfly</text><rect x="450" y="110" width="310" height="85" rx="10" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="605.0" y="138.5" dominant-baseline="middle" font-size="18">Static NodeList</text><text x="605.0" y="166.5" dominant-baseline="middle" font-size="18">Frog · Dragonfly</text><path d="M195 195 L195 290" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 195 L605 290" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="250" font-size="18">Append Heron</text><rect x="40" y="290" width="310" height="90" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="195.0" y="321.0" dominant-baseline="middle" font-size="18">Frog · Dragonfly · Heron</text><text x="195.0" y="349.0" dominant-baseline="middle" font-size="18">length: 3</text><rect x="450" y="290" width="310" height="90" rx="10" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="605.0" y="321.0" dominant-baseline="middle" font-size="18">Frog · Dragonfly</text><text x="605.0" y="349.0" dominant-baseline="middle" font-size="18">length: 2</text><text x="400" y="423" font-size="18">Membership differs; both still refer to real elements.</text></g></svg>
