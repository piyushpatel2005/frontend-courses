<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc"><title id="title">The document tree</title><desc id="desc">Document reaches html. Head and body are children of html. Title belongs to head and main belongs to body.</desc><rect width="760" height="450" rx="16" fill="#fcfaf5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#244c64"/></marker></defs><g font-family="system-ui,sans-serif" fill="#243447"><text x="380" y="36" font-size="24" text-anchor="middle">The Document Tree</text><rect x="275" y="62" width="210" height="54" rx="10" fill="#a5d8ff" stroke="#244c64" stroke-width="2"/><text x="380.0" y="96.0" font-size="20" text-anchor="middle">document</text><rect x="275" y="158" width="210" height="54" rx="10" fill="#c3fae8" stroke="#244c64" stroke-width="2"/><text x="380.0" y="192.0" font-size="20" text-anchor="middle">&lt;html&gt;</text><rect x="85" y="264" width="200" height="54" rx="10" fill="#fff3bf" stroke="#244c64" stroke-width="2"/><text x="185.0" y="298.0" font-size="20" text-anchor="middle">&lt;head&gt;</text><rect x="475" y="264" width="200" height="54" rx="10" fill="#ffd8a8" stroke="#244c64" stroke-width="2"/><text x="575.0" y="298.0" font-size="20" text-anchor="middle">&lt;body&gt;</text><rect x="85" y="368" width="200" height="54" rx="10" fill="#fff3bf" stroke="#244c64" stroke-width="2"/><text x="185.0" y="402.0" font-size="20" text-anchor="middle">&lt;title&gt;</text><rect x="475" y="368" width="200" height="54" rx="10" fill="#b2f2bb" stroke="#244c64" stroke-width="2"/><text x="575.0" y="402.0" font-size="20" text-anchor="middle">&lt;main&gt;</text><path d="M380 116 L380 158" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/><path d="M380 212 V238 H185 V264 M380 238 H575 V264" fill="none" stroke="#244c64" stroke-width="2"/><path d="M185 238 L185 264" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 238 L575 264" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 318 L185 368" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 318 L575 368" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
