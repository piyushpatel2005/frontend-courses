<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 722" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">The Document Tree</title>
<desc id="figure-desc">The Document Tree. Document: document Document Element: &lt;html&gt; Head Branch: &lt;head&gt; contains &lt;title&gt; Body Branch: &lt;body&gt; contains &lt;main&gt; Head and body are siblings. Text is also a node; it sits inside elements.</desc>
