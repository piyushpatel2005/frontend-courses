<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">The Document Tree</tspan>
</text>
<text x="240" y="135.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">document</tspan>
</text>
<text x="240" y="245.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">&lt;html&gt;</tspan>
</text>
<text x="110" y="375.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="110">&lt;head&gt;</tspan>
</text>
<text x="370" y="375.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="370">&lt;body&gt;</tspan>
</text>
<text x="110" y="505.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="110">&lt;title&gt;</tspan>
</text>
<text x="370" y="505.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
