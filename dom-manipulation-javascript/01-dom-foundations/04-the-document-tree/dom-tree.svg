</text>
<text x="240" y="588.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Head and body are siblings under html.</tspan>
<tspan x="240" dy="18.4">Text nodes sit inside elements; they are omitted here.</tspan>
</text>
