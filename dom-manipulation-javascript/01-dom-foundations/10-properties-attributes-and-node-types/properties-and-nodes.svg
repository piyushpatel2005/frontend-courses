<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-labelledby="title desc"><title id="title">Input properties and node kinds</title><desc id="desc">The HTML default remains Tomato when the current input value becomes Basil. The span element has a Packet text child.</desc><rect width="760" height="446" rx="16" fill="#fcfaf5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#244c64"/></marker></defs><g font-family="system-ui,sans-serif" fill="#243447"><text x="380" y="36" font-size="24" text-anchor="middle">Current Values and Node Kinds</text><rect x="40" y="68" width="320" height="88" rx="10" fill="#fff3bf" stroke="#244c64" stroke-width="2"/><text x="200.0" y="105.0" font-size="20" text-anchor="middle">HTML value attribute</text><text x="200.0" y="133.0" font-size="20" text-anchor="middle">Tomato</text><rect x="400" y="68" width="320" height="88" rx="10" fill="#a5d8ff" stroke="#244c64" stroke-width="2"/><text x="560.0" y="105.0" font-size="20" text-anchor="middle">Current value property</text><text x="560.0" y="133.0" font-size="20" text-anchor="middle">Basil</text><text x="380" y="193" font-size="18" text-anchor="middle">Setting seed.value changes the current value.</text><rect x="215" y="232" width="330" height="70" rx="10" fill="#c3fae8" stroke="#244c64" stroke-width="2"/><text x="380.0" y="260.0" font-size="20" text-anchor="middle">&lt;span id=&quot;seed-label&quot;&gt;</text><text x="380.0" y="288.0" font-size="20" text-anchor="middle">Element: nodeType 1</text><path d="M380 302 L380 346" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/><rect x="215" y="346" width="330" height="70" rx="10" fill="#ffd8a8" stroke="#244c64" stroke-width="2"/><text x="380.0" y="374.0" font-size="20" text-anchor="middle">Packet</text><text x="380.0" y="402.0" font-size="20" text-anchor="middle">Text child: nodeType 3</text></g></svg>
