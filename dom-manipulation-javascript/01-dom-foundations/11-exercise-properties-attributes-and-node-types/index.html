<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library meeting room</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Library meeting room</h1>
    <label for="room-input">Assigned room</label>
    <input id="room-input" value="West room">
    <p class="card">Current room: <strong id="current-room">Pending</strong></p>
    <p class="card">HTML default: <strong id="default-room">Pending</strong></p>
    <p class="card"><span id="room-label">Room sign</span> node types: <strong id="room-node-types">Pending</strong></p>
  </main>
</body>
</html>
