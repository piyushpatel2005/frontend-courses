<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418" role="img" aria-labelledby="title desc"><title id="title">Deferred external script order</title><desc id="desc">Fetching overlaps HTML parsing. Execution waits for both parsing and download. This illustrates saved files, not the injected course preview.</desc><rect width="760" height="418" rx="16" fill="#fcfaf5"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#244c64"/></marker></defs><g font-family="system-ui,sans-serif" fill="#243447"><text x="380" y="36" font-size="24" text-anchor="middle">A Deferred Script in Saved Files</text><rect x="170" y="68" width="420" height="66" rx="10" fill="#a5d8ff" stroke="#244c64" stroke-width="2"/><text x="380.0" y="94.0" font-size="20" text-anchor="middle">Reach the external script tag</text><text x="380.0" y="122.0" font-size="20" text-anchor="middle">Start fetching script.js</text><path d="M380 134 L380 174" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="174" width="420" height="66" rx="10" fill="#fff3bf" stroke="#244c64" stroke-width="2"/><text x="380.0" y="200.0" font-size="20" text-anchor="middle">Continue parsing HTML</text><text x="380.0" y="228.0" font-size="20" text-anchor="middle">Create the body and its children</text><path d="M380 240 L380 280" fill="none" stroke="#244c64" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="280" width="420" height="66" rx="10" fill="#b2f2bb" stroke="#244c64" stroke-width="2"/><text x="380.0" y="306.0" font-size="20" text-anchor="middle">After parsing and download finish</text><text x="380.0" y="334.0" font-size="20" text-anchor="middle">Execute the deferred script</text><text x="380" y="388" font-size="18" text-anchor="middle">Course preview injection is a different loading path.</text></g></svg>
