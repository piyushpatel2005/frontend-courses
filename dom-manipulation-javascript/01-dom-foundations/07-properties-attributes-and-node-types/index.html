<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seed desk</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Seed desk</h1>
    <label for="seed-name">Seed name</label>
    <input id="seed-name" value="Tomato">
    <p class="card">Current value: <strong id="current-value">Pending</strong></p>
    <p class="card">HTML default: <strong id="original-value">Pending</strong></p>
    <p class="card"><span id="seed-label">Packet</span> node types: <strong id="node-kinds">Pending</strong></p>
  </main>
</body>
</html>
