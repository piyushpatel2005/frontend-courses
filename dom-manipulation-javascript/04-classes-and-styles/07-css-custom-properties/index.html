<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night-market stall accent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Night-market guide</h1>
    <article id="stall-card" class="stall-card">
      <span class="badge">Stall 12</span>
      <h2>Garden preserves</h2>
      <p>Small-batch fruit spreads.</p>
    </article>
    <button id="warm-accent" type="button">Warm accent</button>
    <button id="default-accent" type="button">Default accent</button>
    <p id="accent-status" role="status">Default accent selected.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
