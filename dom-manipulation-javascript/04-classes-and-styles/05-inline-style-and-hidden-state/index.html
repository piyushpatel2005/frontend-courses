<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inline styles, classes, and hidden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Inline styles, classes, and hidden</h1>
    <p id="weather-notice" class="note">The garden walk starts at noon.</p>
    <button id="accent-notice" type="button">Accent border</button>
    <button id="feature-notice" type="button">Feature notice</button>
    <button id="hide-notice" type="button">Hide notice</button>
    <button id="show-notice" type="button">Show notice</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
