<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add, remove, and check classes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Add, remove, and check classes</h1>
    <p id="programme" class="note">Saturday programme</p>
    <button id="mark-programme" type="button">Mark</button>
    <button id="clear-programme" type="button">Clear</button>
    <p id="programme-status" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
