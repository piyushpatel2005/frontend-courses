<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 882 397" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A disclosure switches between two states</title>
<desc id="figure-desc">Each click toggles is-open and synchronizes hidden and aria-expanded; closed and open are alternatives, not steps performed in one activation.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="882" height="397" fill="#ffffff" />
<rect x="35" y="95" width="315" height="185" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="500" y="95" width="315" height="185" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<path d="M353 142 L497 142" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M497 239 L353 239" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<text x="28" y="40.88" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="28">One click switches between states</tspan>
</text>
<text x="55" y="131.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="55">CLOSED</tspan>
</text>
<text x="55" y="170.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="55">panel: no is-open class</tspan>
</text>
<text x="55" y="203.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="55">panel.hidden = true</tspan>
</text>
<text x="55" y="236.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="55">button aria-expanded="false"</tspan>
</text>
<text x="520" y="131.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="520">OPEN</tspan>
</text>
<text x="520" y="170.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="520">panel: is-open class</tspan>
</text>
<text x="520" y="203.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="520">panel.hidden = false</tspan>
</text>
<text x="520" y="236.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="520">button aria-expanded="true"</tspan>
</text>
<text x="377" y="123.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="377">click: open</tspan>
</text>
<text x="379" y="265.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="379">click: close</tspan>
</text>
<text x="38" y="327.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="38">hidden controls display; aria-expanded reports the same state to assistive technology.</tspan>
</text>
</svg>