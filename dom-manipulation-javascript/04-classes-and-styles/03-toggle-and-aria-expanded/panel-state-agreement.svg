<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
<title id="title">One Panel, Three Matching States</title><desc id="desc">Closed means no is-open class, hidden true, and aria-expanded false. Open means class present, hidden false, and aria-expanded true.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker></defs>
<rect width="800" height="420" rx="16" fill="#fcfaf5"/>
<g font-family="system-ui, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="400.0" y="38" font-size="24" font-weight="700">One Panel, Three Matching States</text>
<rect x="45" y="90" width="310" height="210" rx="10" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="200.0" y="153.0" dominant-baseline="middle" font-size="18">Closed panel</text><text x="200.0" y="181.0" dominant-baseline="middle" font-size="18">is-open: absent</text><text x="200.0" y="209.0" dominant-baseline="middle" font-size="18">hidden: true</text><text x="200.0" y="237.0" dominant-baseline="middle" font-size="18">aria-expanded: &quot;false&quot;</text><rect x="445" y="90" width="310" height="210" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="600.0" y="153.0" dominant-baseline="middle" font-size="18">Open panel</text><text x="600.0" y="181.0" dominant-baseline="middle" font-size="18">is-open: present</text><text x="600.0" y="209.0" dominant-baseline="middle" font-size="18">hidden: false</text><text x="600.0" y="237.0" dominant-baseline="middle" font-size="18">aria-expanded: &quot;true&quot;</text><text x="400" y="350" font-size="18">Each click switches to the other state.</text><text x="400" y="389" font-size="18">hidden belongs to the panel; aria-expanded belongs to the button.</text></g></svg>
