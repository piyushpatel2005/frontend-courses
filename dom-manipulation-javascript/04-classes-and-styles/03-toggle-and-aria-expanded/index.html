<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toggle a panel accessibly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Toggle a panel accessibly</h1>
    <button id="route-toggle" type="button" aria-controls="route-details" aria-expanded="false">Route details</button>
    <p id="route-details" class="note" hidden>Meet at the north gate.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
