<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ceramics workshop card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Community workshops</h1>
    <article id="workshop-card" class="workshop-card">
      <span class="tag">Hands-on</span>
      <h2>Beginner ceramics</h2>
      <p>Shape a small bowl with local clay.</p>
    </article>
    <button id="plum-accent" type="button">Plum accent</button>
    <button id="reset-accent" type="button">Reset accent</button>
    <p id="theme-status" role="status">Theme waiting.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
