<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Newest request guard</title><desc id="desc">An older request captures ID 1. A newer request captures ID 2 and updates latest to 2. The newer response may render; the older response and its errors are ignored.</desc><rect width="900" height="420" fill="#fffaf0"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#334155"/></marker></defs><text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033">Only The Newest Request May Update The Page</text><rect x="35" y="90" width="220" height="95" rx="14" fill="#ffd8a8" stroke="#334155" stroke-width="2"/><text x="145.0" y="130.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Old request</text><text x="145.0" y="156.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Captured ID: 1</text><rect x="35" y="240" width="220" height="95" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/><text x="145.0" y="280.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">New request</text><text x="145.0" y="306.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Captured ID: 2</text><rect x="335" y="90" width="250" height="95" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/><text x="460.0" y="130.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">1 ≠ latest (2)</text><text x="460.0" y="156.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Ignore old result / error</text><rect x="335" y="240" width="250" height="95" rx="14" fill="#c3fae8" stroke="#334155" stroke-width="2"/><text x="460.0" y="280.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">2 = latest (2)</text><text x="460.0" y="306.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Accept current result</text><rect x="665" y="240" width="195" height="95" rx="14" fill="#c3fae8" stroke="#334155" stroke-width="2"/><text x="762.5" y="280.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Update DOM</text><text x="762.5" y="306.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">and status</text><path d="M255 137.5 H335" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M255 287.5 H335" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M585 287.5 H665" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Abort reduces old work; the ID check protects updates after await.</text></svg>