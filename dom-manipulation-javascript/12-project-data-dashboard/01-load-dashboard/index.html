<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trail conditions dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="panel">
    <h1>Trail conditions</h1>
    <p class="note">Offline API fixture · no live network data</p>
    <p id="status" role="status" aria-live="polite">Ready to load.</p>
    <button id="retry" type="button" hidden>Retry</button>
    <ul id="entries" aria-label="Trail conditions results"></ul>
  </main>
</body>
</html>
