<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 982 462" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Only the latest request may paint the DOM</title>
<desc id="figure-desc">Two overlapping dashboard loads receive request IDs 1 and 2. An old result or error is ignored; only current ID 2 may update status and rows. Abort is additional protection.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="982" height="462" fill="#ffffff" />
<rect x="30" y="90" width="250" height="87" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="30" y="240" width="250" height="87" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
<rect x="390" y="90" width="220" height="87" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" />
<rect x="390" y="240" width="220" height="87" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<rect x="718" y="240" width="205" height="87" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<path d="M281 133 L387 133" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M281 283 L387 283" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M612 283 L715 283" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<text x="30" y="42.88" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="30">Overlapping requests: compare before painting</tspan>
</text>
<text x="47" y="118.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="47">Search Cedar → ID 1</tspan>
</text>
<text x="47" y="150.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="47">old request still in flight</tspan>
</text>
<text x="47" y="268.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="47">Search River → ID 2</tspan>
</text>
<text x="47" y="300.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="47">latestRequest = 2</tspan>
</text>
<text x="407" y="121.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="407">ID 1 ≠ latest</tspan>
</text>
<text x="407" y="152.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="407">ignore result / error</tspan>
</text>
<text x="407" y="271.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="407">ID 2 = latest</tspan>
</text>
<text x="407" y="302.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="407">render or show error</tspan>
</text>
<text x="737" y="273.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="737">DOM: River</tspan>
</text>
<text x="737" y="303.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="737">current status</tspan>
</text>
<text x="30" y="387.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="30">Abort asks the old request to stop; the ID guard protects work that still settles.</tspan>
</text>
</svg>