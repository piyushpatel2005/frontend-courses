<tspan x="240">Read After the Native Reset</tspan>
</text>
<text x="240" y="130.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Reset Event</tspan>
</text>
<text x="240" y="159.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Old select value: Evening</tspan>
<tspan x="240" dy="18.4">Schedule renderPickup for a later task.</tspan>
</text>
<text x="240" y="276.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Browser Default Action</tspan>
</text>
<text x="240" y="305.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Restore the selected option: Morning.</tspan>
</text>
<text x="240" y="399.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Timer Callback</tspan>
</text>
<text x="240" y="428.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Read select.value; show Morning.</tspan>
</text>
<text x="240" y="505.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">setTimeout(renderPickup, 0) waits for reset.</tspan>
<tspan x="240" dy="18.4">A normal change can render immediately.</tspan>
