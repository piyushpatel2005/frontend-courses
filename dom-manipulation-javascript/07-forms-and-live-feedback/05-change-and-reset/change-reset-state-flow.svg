<rect x="20" y="100" width="440" height="111" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="20" y="246" width="440" height="88" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="20" y="369" width="440" height="88" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
