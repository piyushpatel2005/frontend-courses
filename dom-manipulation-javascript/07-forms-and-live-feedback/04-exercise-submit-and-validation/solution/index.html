<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Request a book</h1><form id="request" novalidate><label for="book">Book title</label><input id="book" aria-describedby="request-status"><button type="submit">Request hold</button></form><p id="request-status" role="status" aria-live="polite">No request yet.</p>
  </main>
</body>
</html>
