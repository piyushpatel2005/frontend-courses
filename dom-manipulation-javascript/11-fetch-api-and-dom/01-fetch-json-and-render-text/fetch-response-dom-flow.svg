<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 729" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Two Waits Before Rendering</title>
<desc id="figure-desc">Two Waits Before Rendering. First Await: mockFetch(url) fulfills with a Response. Check the Response: Check response.ok before parsing. Second Await: response.json() gives JavaScript data. DOM Text: Use textContent for returned text. This offline fixture returns a real Response. It never makes a network request.</desc>
