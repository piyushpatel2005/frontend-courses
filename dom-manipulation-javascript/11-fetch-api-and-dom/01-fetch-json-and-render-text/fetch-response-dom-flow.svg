</text>
<text x="240" y="130.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">First Await</tspan>
</text>
<text x="240" y="159.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
