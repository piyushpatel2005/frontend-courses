<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Two waits before rendering</title><desc id="desc">Await the fetch-shaped request to obtain a Response. Check the status, then await JSON parsing and render literal text.</desc><rect width="900" height="420" fill="#fffaf0"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#334155"/></marker></defs><text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033">Two Waits Before Rendering</text><rect x="25" y="100" width="170" height="100" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/><text x="110.0" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Request</text><text x="110.0" y="169.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">mockFetch(url)</text><rect x="240" y="100" width="185" height="100" rx="14" fill="#ffd8a8" stroke="#334155" stroke-width="2"/><text x="332.5" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Response</text><text x="332.5" y="169.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Check response.ok</text><rect x="470" y="100" width="170" height="100" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/><text x="555.0" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">JavaScript data</text><text x="555.0" y="169.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">await .json()</text><rect x="685" y="100" width="190" height="100" rx="14" fill="#c3fae8" stroke="#334155" stroke-width="2"/><text x="780.0" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">DOM text</text><text x="780.0" y="169.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">textContent</text><path d="M195 150 H240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 150 H470" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M640 150 H685" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">First await</text><text x="450" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Second await</text><text x="450" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">The offline mock returns a real Response; it makes no network request.</text><text x="450" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">A Response is not the parsed data, and parsed text is not HTML.</text></svg>