<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Library desk</h1>
    <p class="note">Offline preview · deterministic mock data, not a live API</p>
    <label for="scenario">Scenario</label>
    <select id="scenario"><option value="records">Records</option><option value="empty">Empty</option><option value="http">HTTP error</option><option value="offline">Network failure</option></select>
    <button id="check-records" type="button">Check records</button>
    <p id="record-status" role="status">Choose a scenario.</p>
    <ul id="record-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
