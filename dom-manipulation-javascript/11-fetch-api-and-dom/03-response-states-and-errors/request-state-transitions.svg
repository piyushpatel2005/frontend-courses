<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Request states</title><desc id="desc">Start a request in Loading. Successful data becomes Results or Empty. HTTP or network failures become Error. Retry starts Loading again.</desc><rect width="900" height="420" fill="#fffaf0"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#334155"/></marker></defs><text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#172033">Give Each Request An Honest State</text><rect x="335" y="75" width="230" height="70" rx="14" fill="#a5d8ff" stroke="#334155" stroke-width="2"/><text x="450.0" y="116.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Loading</text><rect x="30" y="235" width="230" height="85" rx="14" fill="#c3fae8" stroke="#334155" stroke-width="2"/><text x="145.0" y="270.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Results</text><text x="145.0" y="296.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Nonempty array</text><rect x="335" y="235" width="230" height="85" rx="14" fill="#d0bfff" stroke="#334155" stroke-width="2"/><text x="450.0" y="270.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Empty</text><text x="450.0" y="296.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Successful empty array</text><rect x="640" y="235" width="230" height="85" rx="14" fill="#ffd8a8" stroke="#334155" stroke-width="2"/><text x="755.0" y="270.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Error</text><text x="755.0" y="296.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">HTTP or rejection</text><path d="M335 110 H145 V235" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 145 V235" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><path d="M565 110 H755 V235" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">A new lookup or Retry returns to Loading and clears old rows.</text></svg>