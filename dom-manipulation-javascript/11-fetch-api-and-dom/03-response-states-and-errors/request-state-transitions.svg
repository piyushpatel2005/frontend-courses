<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 992 487" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Loading has three possible outcomes</title>
<desc id="figure-desc">A new lookup starts loading and clears old rows. Successful nonempty data gives results; successful empty data gives no records; HTTP non-OK or rejection gives error. Retry starts loading again.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="992" height="487" fill="#ffffff" />
<rect x="305" y="83" width="350" height="84" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="25" y="277" width="260" height="98" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<rect x="350" y="277" width="260" height="98" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" />
<rect x="675" y="277" width="260" height="98" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
<path d="M365 168 L155 274" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M480 169 L480 274" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M595 168 L805 274" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M935 325 L947 325 L947 72 L650 72 L650 82" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<text x="30" y="40.88" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="30">One lookup, three possible outcomes</tspan>
</text>
<text x="330" y="115.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="330">LOADING</tspan>
</text>
<text x="330" y="145.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="330">Clear old rows; wait for response</tspan>
</text>
<text x="41" y="304.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="41">RESULTS</tspan>
</text>
<text x="41" y="344.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="41">OK + nonempty array</tspan>
</text>
<text x="366" y="304.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="366">NO RECORDS</tspan>
</text>
<text x="366" y="344.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="366">OK + empty array</tspan>
</text>
<text x="691" y="304.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="691">ERROR</tspan>
</text>
<text x="691" y="344.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="691">Non-OK or rejected</tspan>
</text>
<text x="45" y="225.18" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">
<tspan x="45">response.ok + data.length</tspan>
</text>
<text x="387" y="219.18" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">
<tspan x="387">response.ok + empty</tspan>
</text>
<text x="690" y="224.18" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">
<tspan x="690">throw / rejection</tspan>
</text>
<text x="827" y="56.18" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">
<tspan x="827">Retry after error</tspan>
</text>
<text x="28" y="418.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="28">The outcomes are alternatives. Retrying an error starts Loading again.</tspan>
</text>
</svg>