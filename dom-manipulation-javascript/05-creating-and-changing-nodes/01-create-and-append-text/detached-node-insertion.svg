<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Prepare First, Insert Second</title>
<desc id="desc">A created li remains detached until append places it after Gloves.</desc>
<rect width="900" height="330" rx="16" fill="#fffdf7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#30445e"/></marker></defs>
<text x="450" y="39" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="650" fill="#243047">Prepare First, Insert Second</text>
<rect data-card="0" x="30" y="75" width="240" height="146" rx="12" fill="#c9e5fb" stroke="#30445e" stroke-width="2"/>
<text data-card-label="0" x="150.0" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#243047">Detached Element</text>
<text data-card-label="0" x="150.0" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">li: Watering cans</text>
<text data-card-label="0" x="150.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">No parent yet</text>
<path data-connector="0" d="M270 148 L330 148" fill="none" stroke="#30445e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect data-card="1" x="330" y="75" width="240" height="146" rx="12" fill="#e2d8fb" stroke="#30445e" stroke-width="2"/>
<text data-card-label="1" x="450.0" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#243047">append(item)</text>
<text data-card-label="1" x="450.0" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">Choose #supplies</text>
<text data-card-label="1" x="450.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">Insert the prepared node</text>
<path data-connector="1" d="M570 148 L630 148" fill="none" stroke="#30445e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect data-card="2" x="630" y="75" width="240" height="146" rx="12" fill="#c6eee4" stroke="#30445e" stroke-width="2"/>
<text data-card-label="2" x="750.0" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#243047">Visible List</text>
<text data-card-label="2" x="750.0" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">Gloves</text>
<text data-card-label="2" x="750.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">Watering cans</text>
<text x="450" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#243047">Setting textContent prepares the label; it does not put the item on the page.</text>
</svg>
