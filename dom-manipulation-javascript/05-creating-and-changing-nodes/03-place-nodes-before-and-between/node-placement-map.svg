<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 722 462" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Insert before an existing child</title>
<desc id="figure-desc">The #notices parent contains the urgent notice, Saturday, the inserted reminder, then Sunday; insertBefore targets Sunday as its direct child.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="722" height="462" fill="#ffffff" />
<rect x="25" y="72" width="640" height="295" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
<rect x="58" y="133" width="465" height="47" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" />
<rect x="58" y="190" width="465" height="47" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="58" y="247" width="465" height="47" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<rect x="58" y="304" width="465" height="47" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
<text x="25" y="37.14" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="25">#notices: choose the parent and anchor</tspan>
</text>
<text x="45" y="104.53" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
<tspan x="45">ol#notices</tspan>
</text>
<text x="74" y="158.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="74">li  Bridge inspection today</tspan>
</text>
<text x="74" y="215.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="74">li#saturday  Saturday walk</tspan>
</text>
<text x="74" y="272.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="74">li  Bring water  ← inserted</tspan>
</text>
<text x="74" y="329.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="74">li#sunday  Sunday walk  ← anchor</tspan>
</text>
<text x="535" y="282.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="535">insertBefore(</tspan>
</text>
<text x="535" y="303.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="535">reminder,</tspan>
</text>
<text x="535" y="324.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="535">#sunday)</tspan>
</text>
<text x="27" y="403.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="27">The other children keep their order; the reference must belong to this parent.</tspan>
</text>
</svg>