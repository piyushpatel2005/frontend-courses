<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 742 452" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A fragment transfers its children</title>
<desc id="figure-desc">Deep clones of the Thyme card become Basil and Mint in a detached fragment; appending the fragment transfers its children after Thyme and leaves the fragment empty.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="742" height="452" fill="#ffffff" />
<rect x="26" y="93" width="285" height="200" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="425" y="93" width="260" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
<path d="M313 187 L420 187" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<text x="22" y="40.01" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
<tspan x="22">append(fragment) moves its children</tspan>
</text>
<text x="42" y="120.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="42">BEFORE · detached fragment</tspan>
</text>
<text x="55" y="172.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="55">Basil card</tspan>
</text>
<text x="55" y="221.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="55">Mint card</tspan>
</text>
<text x="442" y="120.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="442">AFTER · ul#plants</tspan>
</text>
<text x="445" y="167.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
