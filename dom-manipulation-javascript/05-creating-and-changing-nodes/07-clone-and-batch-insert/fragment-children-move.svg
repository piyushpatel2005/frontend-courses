</text>
<text x="445" y="261.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="445">Mint card</tspan>
</text>
<text x="321" y="171.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="321">append</tspan>
</text>
<text x="28" y="343.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
