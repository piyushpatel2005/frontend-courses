<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 907 522" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A nested click reaches the list listener</title>
<desc id="figure-desc">The clicked span remains event.target. The click bubbles through button and li to #messages where currentTarget is the list; closest finds the button for removal.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="907" height="522" fill="#ffffff" />
<rect x="42" y="93" width="790" height="330" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
<rect x="110" y="174" width="650" height="207" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="200" y="250" width="490" height="92" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
<rect x="245" y="294" width="395" height="37" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" />
<path d="M640 315 L669 315 L669 286 L689 286" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M690 283 L723 283 L723 218 L759 218" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M760 216 L790 216 L790 144 L831 144" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M440 293 L440 251" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-tip)" />
<text x="32" y="42.88" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="32">The click bubbles through nested DOM</tspan>
</text>
<text x="60" y="120.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="60">ul#messages   ← listener; currentTarget here</tspan>
</text>
<text x="128" y="200.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="128">li   ← remove this row only after validating the button</tspan>
</text>
<text x="218" y="275.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="218">button[data-remove]</tspan>
</text>
<text x="259" y="312.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="259">span  “Remove”  ← event.target</tspan>
</text>
<text x="461" y="285.18" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">
<tspan x="461">closest()</tspan>
</text>
<text x="37" y="459.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="37">Solid arrows: click bubbles span → button → li → list. Dashed: closest() lookup.</tspan>
</text>
</svg>