<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">A Click Bubbles Through Ancestors</title>
<desc id="desc">The span is target; the list running the delegated listener is currentTarget. The button and li lie between.</desc>
<rect width="900" height="330" rx="16" fill="#fffdf7"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#30445e"/></marker></defs>
<text x="450" y="39" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" font-weight="650" fill="#243047">A Click Bubbles Through Ancestors</text>
<rect data-card="0" x="30" y="75" width="180" height="146" rx="12" fill="#c9e5fb" stroke="#30445e" stroke-width="2"/>
<text data-card-label="0" x="120.0" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#243047">span</text>
<text data-card-label="0" x="120.0" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">event.target</text>
<text data-card-label="0" x="120.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">Clicked label</text>
<path data-connector="0" d="M210 148 L250 148" fill="none" stroke="#30445e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect data-card="1" x="250" y="75" width="180" height="146" rx="12" fill="#e2d8fb" stroke="#30445e" stroke-width="2"/>
<text data-card-label="1" x="340.0" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#243047">button</text>
<text data-card-label="1" x="340.0" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">closest finds</text>
<text data-card-label="1" x="340.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">this button</text>
<path data-connector="1" d="M430 148 L470 148" fill="none" stroke="#30445e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect data-card="2" x="470" y="75" width="180" height="146" rx="12" fill="#ffe0b8" stroke="#30445e" stroke-width="2"/>
<text data-card-label="2" x="560.0" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#243047">li</text>
<text data-card-label="2" x="560.0" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">Row containing</text>
<text data-card-label="2" x="560.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">the button</text>
<path data-connector="2" d="M650 148 L690 148" fill="none" stroke="#30445e" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect data-card="3" x="690" y="75" width="180" height="146" rx="12" fill="#c6eee4" stroke="#30445e" stroke-width="2"/>
<text data-card-label="3" x="780.0" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#243047">#messages</text>
<text data-card-label="3" x="780.0" y="141" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">currentTarget</text>
<text data-card-label="3" x="780.0" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#243047">List listener</text>
<text x="450" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#243047">The target stays the span. currentTarget identifies the listener running now.</text>
<text x="450" y="293" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#243047">contains(button) keeps the removal inside this list.</text>
</svg>
