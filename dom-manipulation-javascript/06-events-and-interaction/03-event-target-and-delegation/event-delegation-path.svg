<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-labelledby="title desc"><title id="title">A click bubbles to a list listener</title><desc id="desc">The clicked span is event.target while the list holding the listener is event.currentTarget.</desc><rect width="680" height="190" fill="#fffdf7"/><path d="M30 47 Q27 42 37 42 L199 44 Q207 45 207 54 L205 125 Q203 132 195 131 L37 129 Q29 130 30 120 Z" fill="#d0bfff" stroke="#30445e" stroke-width="2.5" stroke-linejoin="round"/><text x="117" y="91" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif" fill="#23354c">span target</text><path d="M250 47 Q247 42 257 42 L419 44 Q427 45 427 54 L425 125 Q423 132 415 131 L257 129 Q249 130 250 120 Z" fill="#fff3bf" stroke="#30445e" stroke-width="2.5" stroke-linejoin="round"/><text x="337" y="91" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif" fill="#23354c">button ancestor</text><path d="M470 47 Q467 42 477 42 L639 44 Q647 45 647 54 L645 125 Q643 132 635 131 L477 129 Q469 130 470 120 Z" fill="#b2f2bb" stroke="#30445e" stroke-width="2.5" stroke-linejoin="round"/><text x="557" y="91" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif" fill="#23354c">list listener</text><path d="M208 86 Q228 83 250 86" fill="none" stroke="#30445e" stroke-width="3" stroke-linecap="round"/><path d="M242 79 L250 86 L242 93" fill="none" stroke="#30445e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M428 86 Q448 83 470 86" fill="none" stroke="#30445e" stroke-width="3" stroke-linecap="round"/><path d="M462 79 L470 86 L462 93" fill="none" stroke="#30445e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
