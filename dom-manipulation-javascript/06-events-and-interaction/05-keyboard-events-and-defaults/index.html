<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trail finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Trail finder</h1>
    <form id="finder">
      <label for="trail">Trail name</label>
      <input id="trail" type="search">
      <button type="submit">Search</button>
    </form>
    <p id="result" role="status">No search yet</p>
  </main>
</body>
</html>
