<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 606" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Register Now, Respond Later</title>
<desc id="figure-desc">Register Now, Respond Later. Setup: addEventListener(&quot;click&quot;, showStatus) Later Activation: Mouse, Enter, or Space delivers a click. Handler Runs: showStatus() updates: Trail is open Pass the function during registration. Calling it there would run it too early.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="606" fill="#ffffff"/>
<path d="M240 188.5 L240 222.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 311.5 L240 345.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="20" y="100" width="440" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="20" y="223" width="440" height="88" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="20" y="346" width="440" height="88" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Register Now, Respond Later</tspan>
</text>
<text x="240" y="130.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Setup</tspan>
</text>
<text x="36" y="159.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="36">addEventListener(&quot;click&quot;, showStatus)</tspan>
</text>
<text x="240" y="253.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Later Activation</tspan>
</text>
<text x="240" y="282.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Mouse, Enter, or Space delivers a click.</tspan>
</text>
<text x="240" y="376.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Handler Runs</tspan>
</text>
<text x="36" y="405.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="36">showStatus() updates: Trail is open</tspan>
</text>
<text x="240" y="482.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Pass the function during registration.</tspan>
<tspan x="240" dy="18.4">Calling it there would run it too early.</tspan>
</text>
</svg>
