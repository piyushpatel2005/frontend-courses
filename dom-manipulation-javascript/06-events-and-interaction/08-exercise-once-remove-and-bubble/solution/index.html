<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop notifications</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Workshop notifications</h1>
    <button id="welcome" type="button">Welcome</button>
    <p id="welcome-count" role="status">Welcomes: 0</p>
    <button id="bell" type="button">Bell</button>
    <button id="mute" type="button">Mute bell</button>
    <p id="bell-count" role="status">Bells: 0</p>
    <div id="controls" aria-label="Workshop controls">
      <button id="standard" type="button">Standard</button>
      <button id="private" type="button">Private</button>
    </div>
    <p id="actions" role="status">Actions: </p>
  </main>
</body>
</html>
