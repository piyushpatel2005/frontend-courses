<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Search Without Stale Details</title><desc id="figure-desc">Search Without Stale Details. Search Input: Trim the query and lowercase both sides. Every Member Card: Set hidden from its name/skill match. Consistent Feedback: Recount visible cards and empty state.
