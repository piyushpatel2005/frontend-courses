<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" role="img" aria-labelledby="title desc">
<title id="title">Search Without Stale Details</title><desc id="desc">Normalize the query and hide nonmatching cards. Recount visible cards; clear the details if the selected card becomes hidden.</desc>
<rect width="840" height="370" rx="18" fill="#fffdf6"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#253e67"/></marker></defs>
<text x="420" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#24334b">Search Without Stale Details</text>
<rect x="30" y="72" width="220" height="110" rx="12" fill="#a5d8ff" stroke="#253e67" stroke-width="2"/>
<text x="140" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Search Input</text>
<text x="140" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Trim + lowercase</text>
<path d="M250 127 H310" stroke="#253e67" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="310" y="72" width="220" height="110" rx="12" fill="#fff3bf" stroke="#253e67" stroke-width="2"/>
<text x="420" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Every Member Card</text>
<text x="420" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Set hidden by match</text>
<path d="M530 127 H590" stroke="#253e67" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="590" y="72" width="220" height="110" rx="12" fill="#b2f2bb" stroke="#253e67" stroke-width="2"/>
<text x="700" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Visible Results</text>
<text x="700" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">Count + empty state</text>
<path d="M420 182 V222" stroke="#253e67" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="200" y="222" width="440" height="74" rx="12" fill="#d0bfff" stroke="#253e67" stroke-width="2"/>
<text x="420" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">If the selected card becomes hidden,</text>
<text x="420" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#142c45">clear selection and restore the detail prompt.</text>
<text x="420" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#24334b">Clearing search reveals cards; it does not select a member.</text>
</svg>
