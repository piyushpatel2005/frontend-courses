<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 629" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">From Button to Tool Details</title>
<desc id="figure-desc">From Button to Tool Details. A Click Inside the Button: Find the button, then its enclosing li. The Card Owns the Data: Read data-tool and data-note.
Move the selected border to this card. Detail Panel: Assign those values with textContent. Selecting another card replaces the details. The button keeps keyboard focus.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="629" fill="#ffffff"/>
<path d="M240 188.5 L240 222.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 334.5 L240 368.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="20" y="100" width="440" height="88" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="20" y="223" width="440" height="111" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="20" y="369" width="440" height="88" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">From Button to Tool Details</tspan>
</text>
<text x="240" y="130.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">A Click Inside the Button</tspan>
</text>
<text x="240" y="159.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Find the button, then its enclosing li.</tspan>
</text>
<text x="240" y="253.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">The Card Owns the Data</tspan>
</text>
<text x="240" y="282.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Read data-tool and data-note.</tspan>
<tspan x="240" dy="18.4">Move the selected border to this card.</tspan>
</text>
<text x="240" y="399.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Detail Panel</tspan>
</text>
<text x="240" y="428.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Assign those values with textContent.</tspan>
</text>
<text x="240" y="505.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Selecting another card replaces the details.</tspan>
<tspan x="240" dy="18.4">The button keeps keyboard focus.</tspan>
</text>
</svg>
