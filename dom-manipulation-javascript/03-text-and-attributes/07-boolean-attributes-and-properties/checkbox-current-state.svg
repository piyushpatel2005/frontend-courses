<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Default And Current Checkbox State</title><desc id="desc">Checking an initially unchecked checkbox changes its checked property to true without adding the checked attribute.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker></defs>
<rect width="800" height="460" rx="16" fill="#fcfaf5"/>
<g font-family="system-ui, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="400.0" y="38" font-size="24" font-weight="700">Default And Current Checkbox State</text>
<text x="400" y="80" font-size="18">Example: &lt;input type=&quot;checkbox&quot;&gt; starts unchecked.</text><rect x="40" y="120" width="310" height="90" rx="10" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="195.0" y="151.0" dominant-baseline="middle" font-size="18">HTML checked attribute</text><text x="195.0" y="179.0" dominant-baseline="middle" font-size="18">absent</text><rect x="450" y="120" width="310" height="90" rx="10" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="605.0" y="151.0" dominant-baseline="middle" font-size="18">JavaScript .checked</text><text x="605.0" y="179.0" dominant-baseline="middle" font-size="18">false</text><path d="M195 210 L195 300" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 210 L605 300" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="265" font-size="18">Visitor checks the box</text><rect x="40" y="300" width="310" height="90" rx="10" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text x="195.0" y="331.0" dominant-baseline="middle" font-size="18">Default attribute</text><text x="195.0" y="359.0" dominant-baseline="middle" font-size="18">still absent</text><rect x="450" y="300" width="310" height="90" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="605.0" y="331.0" dominant-baseline="middle" font-size="18">Current property</text><text x="605.0" y="359.0" dominant-baseline="middle" font-size="18">true</text><text x="400" y="435" font-size="18">Read .checked for the current state, not getAttribute(&quot;checked&quot;).</text></g></svg>
