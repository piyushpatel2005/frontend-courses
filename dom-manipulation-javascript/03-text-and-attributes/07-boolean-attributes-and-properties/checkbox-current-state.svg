<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 529" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Default and Current State</title>
<desc id="figure-desc">Default and Current State. Initially Unchecked: checked attribute: absent
checked property: false After the Visitor Checks It: checked attribute: still absent
checked property: true Read .checked for current state. The attribute describes its default.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="529" fill="#ffffff"/>
<path d="M240 211.5 L240 245.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="20" y="100" width="440" height="111" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="20" y="246" width="440" height="111" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Default and Current State</tspan>
</text>
<text x="240" y="130.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Initially Unchecked</tspan>
</text>
<text x="240" y="159.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">checked attribute: absent</tspan>
<tspan x="240" dy="18.4">checked property: false</tspan>
</text>
<text x="240" y="276.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">After the Visitor Checks It</tspan>
</text>
<text x="240" y="305.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">checked attribute: still absent</tspan>
<tspan x="240" dy="18.4">checked property: true</tspan>
</text>
<text x="240" y="405.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="240">Read .checked for current state.</tspan>
<tspan x="240" dy="18.4">The attribute describes its default.</tspan>
</text>
