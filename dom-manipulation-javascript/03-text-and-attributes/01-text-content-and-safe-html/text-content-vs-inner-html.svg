<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 892 507" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">One string, two assignments</title>
<desc id="figure-desc">The same trusted markup-looking string assigned separately via textContent creates literal text, while innerHTML parses a strong element. Use textContent for untrusted input.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b" /></marker></defs>
<rect x="-16" y="-16" width="892" height="507" fill="#ffffff" />
<rect x="253" y="75" width="350" height="62" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
<rect x="28" y="205" width="360" height="185" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
<rect x="470" y="205" width="360" height="185" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" />
<path d="M280 137 L170 202" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<path d="M575 137 L687 202" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)" />
<text x="30" y="42.88" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="30">One string, two alternatives</tspan>
</text>
<text x="272" y="108.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="272">"&lt;strong&gt;hello&lt;/strong&gt;"</tspan>
</text>
<text x="48" y="235.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="48">A  element.textContent = string</tspan>
</text>
<text x="48" y="289.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="48">DOM child: text node</tspan>
</text>
<text x="48" y="329.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="48">Visible: &lt;strong&gt;hello&lt;/strong&gt;</tspan>
</text>
<text x="48" y="368.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="48">No &lt;strong&gt; element</tspan>
</text>
<text x="490" y="235.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="490">B  element.innerHTML = string</tspan>
</text>
<text x="490" y="289.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="490">DOM child: &lt;strong&gt;</tspan>
</text>
<text x="490" y="329.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="490">  └─ text node: hello</tspan>
</text>
<text x="490" y="368.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="490">Visible: bold hello</tspan>
</text>
<text x="30" y="430.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="30">Use A for visitor or remote text. B parses markup and needs trusted input.</tspan>
</text>
</svg>