<svg xmlns="http://www.w3.org/2000/svg" width="800" height="425" viewBox="0 0 800 425" role="img" aria-labelledby="title desc">
<title id="title">Text Or Markup?</title><desc id="desc">The illustrative strong hello string remains literal under textContent but becomes a strong element under innerHTML.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#1e293b" stroke-width="1.5"/></marker></defs>
<rect width="800" height="425" rx="16" fill="#fcfaf5"/>
<g font-family="system-ui, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="400.0" y="38" font-size="24" font-weight="700">Text Or Markup?</text>
<text x="400" y="78" font-size="18">Example input: &lt;strong&gt;hello&lt;/strong&gt;</text><rect x="40" y="120" width="300" height="85" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="190.0" y="148.5" dominant-baseline="middle" font-size="18">textContent</text><text x="190.0" y="176.5" dominant-baseline="middle" font-size="18">writes plain text</text><path d="M340 162.5 L450 162.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="120" width="310" height="85" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="605.0" y="148.5" dominant-baseline="middle" font-size="18">&lt;strong&gt;hello&lt;/strong&gt;</text><text x="605.0" y="176.5" dominant-baseline="middle" font-size="18">tags stay visible</text><rect x="40" y="260" width="300" height="85" rx="10" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/><text x="190.0" y="288.5" dominant-baseline="middle" font-size="18">innerHTML</text><text x="190.0" y="316.5" dominant-baseline="middle" font-size="18">parses markup</text><path d="M340 302.5 L450 302.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="260" width="310" height="85" rx="10" fill="#ffedd5" stroke="#1e293b" stroke-width="2"/><text x="605.0" y="288.5" dominant-baseline="middle" font-size="18">hello inside a strong element</text><text x="605.0" y="316.5" dominant-baseline="middle" font-size="18">tags become structure</text><text x="400" y="392" font-size="18">Use textContent for visitor input and remote data.</text></g></svg>
