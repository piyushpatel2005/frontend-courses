<svg xmlns="http://www.w3.org/2000/svg" width="740" height="250" viewBox="0 0 740 250" role="img" aria-labelledby="title desc">
<title id="title">Text content keeps visitor input as text</title>
<desc id="desc">A visitor string containing angle brackets flows through textContent into a paragraph showing literal brackets; innerHTML instead parses the same input as markup and is unsafe for untrusted data.</desc>
<rect width="740" height="250" rx="18" fill="#fcfaf4"/>
<text x="28" y="35" fill="#25334a" font-size="23" font-family="system-ui">One string, two different interpretations</text>
<path d="M32 71 Q28 68 36 67 L183 69 Q190 72 186 76 L187 129 Q183 134 176 132 L36 133 Q30 131 32 124 Z" fill="#fff3bf" stroke="#344765" stroke-width="2.5"/>
<text x="46" y="94" fill="#263751" font-size="17" font-family="system-ui">visitor input</text>
<text x="46" y="118" fill="#263751" font-size="16" font-family="monospace">&lt;clouds&gt;</text>
<path d="M188 95 L273 95" stroke="#324866" stroke-width="3" fill="none"/>
<path d="M273 95 L262 89 L262 101 Z" fill="#324866"/>
<path d="M275 67 Q271 65 280 65 L440 67 Q446 69 443 75 L443 117 Q441 122 435 122 L280 124 Q273 120 275 115 Z" fill="#d5f5e1" stroke="#344765" stroke-width="2.5"/>
<text x="292" y="100" fill="#263751" font-size="17" font-family="monospace">textContent</text>
<path d="M444 95 L511 95" stroke="#324866" stroke-width="3" fill="none"/>
<path d="M511 95 L500 89 L500 101 Z" fill="#324866"/>
<path d="M513 67 Q510 65 518 65 L702 67 Q707 70 705 75 L705 123 Q704 130 697 130 L518 130 Q513 128 513 122 Z" fill="#d5f5e1" stroke="#344765" stroke-width="2.5"/>
<text x="527" y="95" fill="#263751" font-size="17" font-family="system-ui">literal &lt;clouds&gt;</text>
<text x="527" y="118" fill="#305c42" font-size="14" font-family="system-ui">no new HTML element</text>
<path d="M120 134 L120 197 L274 197" stroke="#9a4250" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
<path d="M274 197 L263 191 L263 203 Z" fill="#9a4250"/>
<path d="M275 165 Q272 163 280 163 L440 165 Q446 169 443 174 L443 215 Q439 220 434 220 L280 220 Q275 217 275 212 Z" fill="#ffe3dc" stroke="#9a4250" stroke-width="2.5"/>
<text x="292" y="197" fill="#6b2833" font-size="17" font-family="monospace">innerHTML</text>
<path d="M444 192 L511 192" stroke="#9a4250" stroke-width="3" fill="none"/>
<path d="M511 192 L500 186 L500 198 Z" fill="#9a4250"/>
<path d="M513 165 Q510 163 518 163 L702 165 Q707 169 705 174 L705 215 Q704 220 697 220 L518 220 Q513 217 513 211 Z" fill="#ffe3dc" stroke="#9a4250" stroke-width="2.5"/>
<text x="527" y="192" fill="#6b2833" font-size="17" font-family="system-ui">parsed as markup</text>
<text x="527" y="212" fill="#6b2833" font-size="14" font-family="system-ui">not for visitor input</text>
</svg>
