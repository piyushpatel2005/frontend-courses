<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="title desc">
<title id="title">Array Positions Start at Zero</title><desc id="desc">The illustrative stops array has Harbor at index zero, Museum at index one, and Library at index two. Its length is three.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs>
<rect width="820" height="330" fill="#fffcf5"/>
<g font-family="Arial, sans-serif" fill="#1e293b" font-size="18">
<text x="410" y="35" text-anchor="middle" font-size="24" font-weight="bold">Array Positions Start at Zero</text>
<text x="410" y="78" text-anchor="middle">stops = ["Harbor", "Museum", "Library"]</text><text x="185" y="122" text-anchor="middle">index 0</text><rect x="85" y="140" width="200" height="75" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/><text x="185.0" y="183.5" text-anchor="middle">Harbor</text><text x="410" y="122" text-anchor="middle">index 1</text><rect x="310" y="140" width="200" height="75" rx="12" fill="#ccfbf1" stroke="#1e293b" stroke-width="1.5"/><text x="410.0" y="183.5" text-anchor="middle">Museum</text><text x="635" y="122" text-anchor="middle">index 2</text><rect x="535" y="140" width="200" height="75" rx="12" fill="#ffedd5" stroke="#1e293b" stroke-width="1.5"/><text x="635.0" y="183.5" text-anchor="middle">Library</text><text x="410" y="264" text-anchor="middle">length = 3      last index = length − 1 = 2</text><text x="410" y="301" text-anchor="middle">stops[0] → "Harbor"       stops[2] → "Library"</text>
</g></svg>
