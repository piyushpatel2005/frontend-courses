<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 842 452" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Sharing Is Not Copying</title>
<desc id="figure-desc">queue and other point to the same array. slice creates a separate outer array. Primitive position replacement in the copy leaves queue unchanged.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="842" height="452" fill="#ffffff"/>
<path d="M160 115 L327 151" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M160 183 L327 172" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M502 210 L502 269" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="327" y="115" width="350" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="327" y="272" width="350" height="78" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="256.5" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="256.5">Sharing Is Not Copying</tspan>
</text>
<text x="84" y="117.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="84">queue</tspan>
</text>
<text x="84" y="182.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="84">other</tspan>
</text>
<text x="415.6" y="146.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="415.6">one shared array</tspan>
</text>
<text x="395.5" y="184.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="395.5">[&quot;first&quot;, &quot;second&quot;]</tspan>
</text>
<text x="545.4" y="247.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="545.4">slice() copies the outer array</tspan>
</text>
<text x="389.9" y="301.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="389.9">copy = queue.slice()</tspan>
</text>
<text x="410.2" y="331.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="410.2">separate outer array</tspan>
</text>
<text x="115.56" y="390.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="115.56">Changing copy[0] leaves queue[0] alone; nested objects still share.</tspan>
</text>
</svg>
