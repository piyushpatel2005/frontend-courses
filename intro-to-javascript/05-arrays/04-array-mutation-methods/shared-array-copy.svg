<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-labelledby="title desc">
<title id="title">Sharing an Array Is Not Copying It</title><desc id="desc">The names queue and other point to one array. A copy made with slice points to a separate array. Changing a primitive item in the copy leaves the original unchanged.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs>
<rect width="820" height="480" fill="#fffcf5"/>
<g font-family="Arial, sans-serif" fill="#1e293b" font-size="18">
<text x="410" y="35" text-anchor="middle" font-size="24" font-weight="bold">Sharing an Array Is Not Copying It</text>
<rect x="30" y="85" width="210" height="70" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/><text x="135.0" y="126.0" text-anchor="middle">queue</text><rect x="30" y="205" width="210" height="70" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/><text x="135.0" y="246.0" text-anchor="middle">other = queue</text><path d="M240,120 L280,120 L280,175 L330,175 M240,240 L280,240 L280,175" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M280,175 L330,175" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="130" width="440" height="90" rx="12" fill="#ccfbf1" stroke="#1e293b" stroke-width="1.5"/><text x="550.0" y="167.5" text-anchor="middle">One shared array</text><text x="550.0" y="194.5" text-anchor="middle">[&quot;first&quot;, &quot;second&quot;]</text><rect x="30" y="325" width="255" height="70" rx="12" fill="#ede9fe" stroke="#1e293b" stroke-width="1.5"/><text x="157.5" y="366.0" text-anchor="middle">copy = queue.slice()</text><path d="M285,360 L330,360" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="315" width="440" height="90" rx="12" fill="#ffedd5" stroke="#1e293b" stroke-width="1.5"/><text x="550.0" y="352.5" text-anchor="middle">Separate outer array</text><text x="550.0" y="379.5" text-anchor="middle">[&quot;first&quot;, &quot;second&quot;]</text><text x="410" y="450" text-anchor="middle">copy[0] = "new" leaves queue[0] as "first".</text>
</g></svg>
