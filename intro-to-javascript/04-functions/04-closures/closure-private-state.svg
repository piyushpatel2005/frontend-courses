<svg xmlns="http://www.w3.org/2000/svg" width="820" height="365" viewBox="0 0 820 365" role="img" aria-labelledby="title desc">
<title id="title">Each Counter Remembers Its Own State</title><desc id="desc">Two calls to makeCounter create different count variables. Calling first changes only the first count.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs>
<rect width="820" height="365" fill="#fffcf5"/>
<g font-family="Arial, sans-serif" fill="#1e293b" font-size="18">
<text x="410" y="35" text-anchor="middle" font-size="24" font-weight="bold">Each Counter Remembers Its Own State</text>
<rect x="35" y="85" width="235" height="85" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/><text x="152.5" y="133.5" text-anchor="middle">first = makeCounter()</text><path d="M270,127 L345,127" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="85" width="435" height="85" rx="12" fill="#ccfbf1" stroke="#1e293b" stroke-width="1.5"/><text x="562.5" y="120.0" text-anchor="middle">First closure: count starts at 0</text><text x="562.5" y="147.0" text-anchor="middle">first() → 1       first() → 2</text><rect x="35" y="200" width="235" height="85" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/><text x="152.5" y="248.5" text-anchor="middle">second = makeCounter()</text><path d="M270,242 L345,242" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="200" width="435" height="85" rx="12" fill="#ede9fe" stroke="#1e293b" stroke-width="1.5"/><text x="562.5" y="235.0" text-anchor="middle">Second closure: count starts at 0</text><text x="562.5" y="262.0" text-anchor="middle">second() → 1</text><text x="410" y="330" text-anchor="middle">The count lives outside the returned function, so it is not reset.</text>
</g></svg>
