<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 872 432" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Each Counter Keeps Its Own State</title>
<desc id="figure-desc">Two makeCounter calls create separate counts. Calling one returned function does not change the other count.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="872" height="432" fill="#ffffff"/>
<path d="M420 121 L235 167" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M420 121 L605 167" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="60" y="170" width="330" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="450" y="170" width="330" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="204" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="204">Each Counter Keeps Its Own State</tspan>
</text>
<text x="335.63" y="99.14" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700">
<tspan x="335.63">makeCounter()</tspan>
</text>
<text x="101.1" y="202.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="101.1">first = makeCounter()</tspan>
</text>
<text x="165.33" y="234.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="165.33">private count</tspan>
</text>
<text x="134.73" y="269.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="134.73">first() → 1  →  2</tspan>
</text>
<text x="485.2" y="202.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="485.2">second = makeCounter()</tspan>
</text>
<text x="555.33" y="234.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="555.33">private count</tspan>
</text>
<text x="551.28" y="269.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="551.28">second() → 1</tspan>
</text>
<text x="113.28" y="370.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="113.28">Each factory call creates its own count; inner calls retain that count.</tspan>
</text>
</svg>
