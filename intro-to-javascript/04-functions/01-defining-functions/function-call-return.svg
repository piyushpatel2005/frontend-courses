<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" role="img" aria-labelledby="title desc">
<title id="title">A Call Produces a Value</title><desc id="desc">makeBadge receives Ari as its name parameter, returns Visitor: Ari, and the caller can print the result.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,5 L0,10" fill="none" stroke="#2563eb" stroke-width="2"/></marker></defs>
<rect width="820" height="330" fill="#fffcf5"/>
<g font-family="Arial, sans-serif" fill="#1e293b" font-size="18">
<text x="410" y="35" text-anchor="middle" font-size="24" font-weight="bold">A Call Produces a Value</text>
<rect x="25" y="95" width="200" height="105" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="1.5"/><text x="125.0" y="140.0" text-anchor="middle">Call</text><text x="125.0" y="167.0" text-anchor="middle">makeBadge(&quot;Ari&quot;)</text><path d="M225,147 L290,147" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="95" width="240" height="105" rx="12" fill="#ede9fe" stroke="#1e293b" stroke-width="1.5"/><text x="410.0" y="126.5" text-anchor="middle">Inside makeBadge</text><text x="410.0" y="153.5" text-anchor="middle">name is &quot;Ari&quot;</text><text x="410.0" y="180.5" text-anchor="middle">return `Visitor: ${name}`</text><path d="M530,147 L595,147" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="595" y="95" width="200" height="105" rx="12" fill="#ccfbf1" stroke="#1e293b" stroke-width="1.5"/><text x="695.0" y="140.0" text-anchor="middle">Returned value</text><text x="695.0" y="167.0" text-anchor="middle">&quot;Visitor: Ari&quot;</text><text x="410" y="255" text-anchor="middle">const badge = makeBadge("Ari");</text><text x="410" y="290" text-anchor="middle">console.log(badge) prints the value; return does not print.</text>
</g></svg>
