<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title desc"><title id="title">Calls Wait; Returns Resume Them</title><desc id="desc">sum([2, 3]) waits for sum([3]), which waits for sum([]); returns unwind from 0 to 3 to 5.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="470.0" y="36" font-family="Arial, sans-serif" font-size="25" fill="#1e293b" text-anchor="middle">Calls Wait; Returns Resume Them</text><rect x="30" y="85" width="260" height="95" rx="14" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="160.0" y="124.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">sum([2, 3])</text><text x="160.0" y="154.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">waits for 2 + sum([3])</text><path d="M290 132 H340" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="85" width="260" height="95" rx="14" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/><text x="470.0" y="124.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">sum([3])</text><text x="470.0" y="154.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">waits for 3 + sum([])</text><path d="M600 132 H650" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="85" width="260" height="95" rx="14" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="780.0" y="124.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">sum([])</text><text x="780.0" y="154.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">base case: return 0</text><path d="M780 180 V245" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="245" width="260" height="95" rx="14" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="780.0" y="284.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">0</text><text x="780.0" y="314.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">no more calls</text><path d="M650 292 H600" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="245" width="260" height="95" rx="14" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/><text x="470.0" y="284.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">3 + 0</text><text x="470.0" y="314.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">return 3</text><path d="M340 292 H290" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="245" width="260" height="95" rx="14" fill="#ede9fe" stroke="#64748b" stroke-width="2"/><text x="160.0" y="284.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">2 + 3</text><text x="160.0" y="314.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">return 5</text><text x="470" y="390" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">The call stack holds each unfinished call until its child returns.</text></svg>