<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 932 497" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Calls Wait; Returns Resume Them</title>
<desc id="figure-desc">sum([2,3]) waits for sum([3]), which waits for sum([]). The base case returns zero and the callers resume with three then five.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="932" height="497" fill="#ffffff"/>
<path d="M256 154 L346 154" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M556 154 L646 154" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M751 206 L751 280" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M646 326 L556 326" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M346 326 L256 326" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="46" y="108" width="210" height="98" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="346" y="108" width="210" height="98" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="646" y="108" width="210" height="98" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="46" y="280" width="210" height="91" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="346" y="280" width="210" height="91" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="646" y="280" width="210" height="91" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="240.75" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="240.75">Calls Wait; Returns Resume Them</tspan>
</text>
<text x="89.34" y="136.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="89.34">sum([2, 3])</tspan>
</text>
<text x="61.9" y="176.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="61.9">waits for 2 + sum([3])</tspan>
</text>
<text x="406.16" y="136.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="406.16">sum([3])</tspan>
</text>
<text x="365.95" y="176.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="365.95">waits for 3 + sum([])</tspan>
</text>
<text x="711.76" y="136.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="711.76">sum([])</tspan>
</text>
<text x="674.05" y="176.05" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="674.05">base case: return 0</tspan>
</text>
<text x="121.5" y="307.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="121.5">2 + 3</tspan>
</text>
<text x="107.26" y="343.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="107.26">returns 5</tspan>
</text>
<text x="421.5" y="307.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="421.5">3 + 0</tspan>
</text>
<text x="407.26" y="343.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="407.26">returns 3</tspan>
</text>
<text x="745.1" y="307.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="745.1">0</tspan>
</text>
<text x="707.26" y="343.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="707.26">returns 0</tspan>
</text>
<text x="151.92" y="435.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="151.92">Calls descend toward the base case; values unwind back to the caller.</tspan>
</text>
</svg>
