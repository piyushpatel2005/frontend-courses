<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title desc"><title id="title">Follow the Value Through the Chain</title><desc id="desc">Orders become selected objects, line totals, and finally one number.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="470.0" y="36" font-family="Arial, sans-serif" font-size="25" fill="#1e293b" text-anchor="middle">Follow the Value Through the Chain</text><rect x="25" y="90" width="190" height="150" rx="14" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="120.0" y="127.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Input orders</text><text x="120.0" y="157.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Book: qty 2</text><text x="120.0" y="187.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Pen: qty 10</text><text x="120.0" y="217.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Bag: qty 1</text><path d="M215 165 H260" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="260" y="90" width="190" height="150" rx="14" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/><text x="355.0" y="142.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">filter</text><text x="355.0" y="172.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Keep qty &gt; 1</text><text x="355.0" y="202.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Book and Pen</text><path d="M450 165 H495" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="495" y="90" width="190" height="150" rx="14" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="590.0" y="142.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">map</text><text x="590.0" y="172.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">price × qty</text><text x="590.0" y="202.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">[24, 10]</text><path d="M685 165 H730" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="90" width="185" height="150" rx="14" fill="#ede9fe" stroke="#64748b" stroke-width="2"/><text x="822.5" y="142.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">reduce</text><text x="822.5" y="172.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Start at 0</text><text x="822.5" y="202.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Return 34</text><text x="470" y="292" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Each callback receives the current item.</text><text x="470" y="327" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">reduce also receives the running result as its first argument.</text><text x="470" y="370" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">New arrays after filter and map; a number after this reduce.</text></svg>