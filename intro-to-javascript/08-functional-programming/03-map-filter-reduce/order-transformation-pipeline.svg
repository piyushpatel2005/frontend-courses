<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 824.5" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Follow the Type Through a Chain</title>
<desc id="figure-desc">Illustrative orders are Book price 12 quantity 2, Pen price 1 quantity 10, and Bag price 35 quantity 1. Filter keeps Book and Pen, map computes 24 and 10, reduce totals 34.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="824.5" fill="#ffffff"/>
<path d="M240 190.5 L240 244.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 345.5 L240 399.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 500.5 L240 554.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="0" y="90" width="480" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="0" y="245" width="480" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="0" y="400" width="480" height="100" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="0" y="555" width="480" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Follow the Type Through a Chain</tspan>
</text>
<text x="240" y="132.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Orders: Book, Pen, Bag</tspan>
</text>
<text x="240" y="155.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Array of objects</tspan>
</text>
<text x="240" y="287.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">filter: keep qty &gt; 1</tspan>
</text>
<text x="240" y="310.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Book and Pen objects</tspan>
</text>
<text x="240" y="442.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">map: price * qty</tspan>
</text>
<text x="240" y="465.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Numbers: [24, 10]</tspan>
</text>
<text x="240" y="597.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">reduce from 0</tspan>
</text>
<text x="240" y="620.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">One number: 34</tspan>
</text>
<text x="240" y="725.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">A number is not an array to keep mapping.</tspan>
</text>
</svg>
