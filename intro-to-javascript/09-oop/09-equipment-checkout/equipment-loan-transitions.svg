<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title desc"><title id="title">Checkout and Return Change One Kit</title><desc id="desc">A camera kit starts ready, becomes on loan after checkout, and becomes ready after return; duplicate checkout is refused.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="470.0" y="36" font-family="Arial, sans-serif" font-size="25" fill="#1e293b" text-anchor="middle">Checkout and Return Change One Kit</text><rect x="30" y="110" width="260" height="120" rx="14" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/><text x="160.0" y="147.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Ready</text><text x="160.0" y="177.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">available: true</text><text x="160.0" y="207.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">#onLoan: false</text><path d="M290 170 H340" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="110" width="260" height="120" rx="14" fill="#ffedd5" stroke="#64748b" stroke-width="2"/><text x="470.0" y="147.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">On loan</text><text x="470.0" y="177.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">available: false</text><text x="470.0" y="207.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">#onLoan: true</text><path d="M600 170 H650" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="110" width="260" height="120" rx="14" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/><text x="780.0" y="147.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Ready again</text><text x="780.0" y="177.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">available: true</text><text x="780.0" y="207.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">#onLoan: false</text><text x="315" y="80" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">checkout()</text><text x="625" y="80" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">returnItem()</text><text x="470" y="290" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">A second checkout while on loan returns false; state stays on loan.</text><text x="470" y="340" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Equipment methods own the private field; CameraKit uses their public interface.</text></svg>