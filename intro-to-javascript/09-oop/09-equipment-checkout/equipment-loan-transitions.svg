<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 892 457" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Checkout and Return Change One Kit</title>
<desc id="figure-desc">The camera kit starts ready, checkout makes it on loan, and return restores readiness. A repeated checkout is refused without changing state.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="892" height="457" fill="#ffffff"/>
<path d="M277 165 L581 165" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M581 244 L277 244" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M806 173 L833 173 L833 224 L806 224" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="52" y="140" width="225" height="112" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="581" y="140" width="225" height="112" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="200.5" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="200.5">Checkout and Return Change One Kit</tspan>
</text>
<text x="134.3" y="172.14" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="134.3">Ready</tspan>
</text>
<text x="95.15" y="206.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="95.15">available: true</tspan>
</text>
<text x="99.74" y="232.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="99.74">#onLoan: false</tspan>
</text>
<text x="651.42" y="172.14" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="651.42">On loan</tspan>
</text>
<text x="619.56" y="206.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="619.56">available: false</tspan>
</text>
<text x="597.96" y="231.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="597.96">checkout again → false</tspan>
</text>
<text x="337.66" y="132.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="337.66">checkout() succeeds</tspan>
</text>
<text x="327.94" y="285.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="327.94">returnItem() succeeds</tspan>
</text>
<text x="218.32" y="395.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="218.32">A refused second checkout leaves the kit on loan.</tspan>
</text>
</svg>
