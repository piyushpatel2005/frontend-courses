<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 669.5" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Methods Control Private State</title>
<desc id="figure-desc">A reserve call changes private available from one to zero and returns true. A public getter reads the remaining zero.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="669.5" fill="#ffffff"/>
<path d="M240 190.5 L240 244.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 345.5 L240 399.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="0" y="90" width="480" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="0" y="245" width="480" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="0" y="400" width="480" height="100" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Methods Control Private State</tspan>
</text>
<text x="20" y="132.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="20">counter.reserve()</tspan>
</text>
<text x="240" y="155.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">A public method call</tspan>
</text>
<text x="240" y="287.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Inside SeatCounter</tspan>
</text>
<text x="240" y="310.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">#available: 1 → 0; return true</tspan>
</text>
<text x="240" y="442.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Read counter.available</tspan>
</text>
<text x="240" y="465.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Getter returns 0, without parentheses</tspan>
</text>
<text x="240" y="570.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Outside code cannot name #available.</tspan>
</text>
</svg>
