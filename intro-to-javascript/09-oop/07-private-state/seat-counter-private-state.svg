<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-labelledby="title desc"><title id="title">A Method Controls the State Change</title><desc id="desc">A public reserve call can update the private count; the available getter reads it without exposing assignment.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="470.0" y="36" font-family="Arial, sans-serif" font-size="25" fill="#1e293b" text-anchor="middle">A Method Controls the State Change</text><rect x="30" y="105" width="260" height="140" rx="14" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="160.0" y="152.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Public call</text><text x="160.0" y="182.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">counter.reserve()</text><text x="160.0" y="212.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">asks for one seat</text><path d="M290 175 H340" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340" y="105" width="260" height="140" rx="14" fill="#ede9fe" stroke="#64748b" stroke-width="2"/><text x="470.0" y="152.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Inside SeatCounter</text><text x="470.0" y="182.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">#available: 1 → 0</text><text x="470.0" y="212.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">return true</text><path d="M600 175 H650" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="650" y="105" width="260" height="140" rx="14" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/><text x="780.0" y="152.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Public read</text><text x="780.0" y="182.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">counter.available</text><text x="780.0" y="212.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">returns 0</text><text x="470" y="305" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">A second reserve() sees zero, returns false, and leaves zero unchanged.</text><text x="470" y="355" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Outside code cannot name counter.#available.</text></svg>