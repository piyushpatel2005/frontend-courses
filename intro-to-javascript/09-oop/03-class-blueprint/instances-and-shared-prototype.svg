<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="0 0 940 450" role="img" aria-labelledby="title desc"><title id="title">Separate State, Shared Methods</title><desc id="desc">Mina and Teo have their own fields; both look up methods on one WorkshopPass prototype.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><text x="470.0" y="36" font-family="Arial, sans-serif" font-size="25" fill="#1e293b" text-anchor="middle">Separate State, Shared Methods</text><rect x="40" y="80" width="270" height="125" rx="14" fill="#dbeafe" stroke="#64748b" stroke-width="2"/><text x="175.0" y="119.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">mina: own properties</text><text x="175.0" y="149.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">holder: &quot;Mina&quot;</text><text x="175.0" y="179.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">entries: 1</text><rect x="630" y="80" width="270" height="125" rx="14" fill="#ccfbf1" stroke="#64748b" stroke-width="2"/><text x="765.0" y="119.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">teo: own properties</text><text x="765.0" y="149.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">holder: &quot;Teo&quot;</text><text x="765.0" y="179.5" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">entries: 1</text><rect x="330" y="245" width="280" height="120" rx="14" fill="#ede9fe" stroke="#64748b" stroke-width="2"/><text x="470.0" y="282.0" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">WorkshopPass.prototype</text><text x="470.0" y="312.0" font-family="Arial, sans-serif" font-size="20" fill="#1