<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 757" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Own Fields, Shared Methods</title>
<desc id="figure-desc">Mina and Teo have separate holder and entries fields. Both instances look up methods on the same WorkshopPass prototype.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="757" fill="#ffffff"/>
<path d="M30.5 142.5 L0 142.5 L0 520 L29.5 520" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 360.5 L240 464.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="30" y="90" width="420" height="105" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="30" y="255" width="420" height="105" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="30" y="465" width="420" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Own Fields, Shared Methods</tspan>
</text>
<text x="240" y="134.9" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">mina: Own Fields</tspan>
</text>
<text x="240" y="158.16" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">holder: &quot;Mina&quot;     entries: 1</tspan>
</text>
<text x="240" y="299.9" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">teo: Own Fields</tspan>
</text>
<text x="240" y="323.16" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">holder: &quot;Teo&quot;     entries: 1</tspan>
</text>
<text x="240" y="512.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">One WorkshopPass.prototype</tspan>
</text>
<text x="240" y="535.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Shared useEntry() and describe()</tspan>
</text>
<text x="240" y="635.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">A method runs with its calling instance as this.</tspan>
<tspan x="240" dy="20.7">Shared methods do not imply shared counts.</tspan>
</text>
</svg>
