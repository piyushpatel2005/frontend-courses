<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-labelledby="title desc" style="background-color:#ffffff">
<title id="title">Named module import to page output</title><desc id="desc">The labels.js module exports eventLabel; main.js imports the named value from ./labels.js and writes Next: Garden meetup into the page's result paragraph.</desc>
<rect width="800" height="320" fill="#ffffff"/>
<rect x="30" y="24" width="172" height="26" rx="13" fill="#f5f3ff"/><text x="116" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#6d28d9">JAVASCRIPT MODULES</text>
<text x="30" y="82" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">A named value travels to the page</text><text x="30" y="109" font-family="Arial,sans-serif" font-size="15" fill="#475569">Export it once, import it by name, then display it.</text>
<path d="M242 205H294 M506 205H558" fill="none" stroke="#64748b" stroke-width="2"/><path d="M288 200l6 5-6 5 M552 200l6 5-6 5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="147" width="212" height="125" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="294" y="147" width="212" height="125" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="558" y="147" width="212" height="125" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="47" y="164" width="7" height="24" rx="3" fill="#7c3aed"/><text x="66" y="183" font-family="monospace" font-size="18" font-weight="700" fill="#1a1a2e">labels.js</text><text x="48" y="215" font-family="Arial,sans-serif" font-size="16" fill="#475569">named export</text><rect x="48" y="229" width="177" height="29" rx="7" fill="#f5f3ff"/><text x="58" y="249" font-family="monospace" font-size="15" font-weight="700" fill="#6d28d9">eventLabel</text>
<rect x="311" y="164" width="7" height="24" rx="3" fill="#3b82f6"/><text x="330" y="183" font-family="monospace" font-size="18" font-weight="700" fill="#1a1a2e">main.js</text><text x="312" y="215" font-family="Arial,sans-serif" font-size="15" fill="#475569">imports eventLabel from</text><rect x="312" y="229" width="177" height="29" rx="7" fill="#eff6ff"/><text x="322" y="249" font-family="monospace" font-size="15" font-weight="700" fill="#1d4ed8">./labels.js</text>
<rect x="575" y="164" width="7" height="24" rx="3" fill="#059669"/><text x="594" y="183" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Page</text><text x="576" y="215" font-family="Arial,sans-serif" font-size="16" fill="#475569">#result paragraph</text><rect x="576" y="229" width="177" height="29" rx="7" fill="#ecfdf5"/><text x="586" y="249" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#047857">Next: Garden meetup</text>
</svg>
