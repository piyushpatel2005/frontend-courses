<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">Two Names, Separate Number Values</title><desc id="desc">ticketPrice starts with the same number as basePrice. After the facility charge, ticketPrice is 29 but basePrice remains 24.</desc>
<rect width="760" height="410" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="380" y="40" font-size="26" font-weight="bold">Two Names, Separate Number Values</text>
<rect x="30" y="80" width="300" height="85" rx="14" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="180.0" y="115.5" font-size="20">const basePrice = 24</text><text x="180.0" y="143.5" font-size="20">basePrice: 24</text><rect x="430" y="80" width="300" height="85" rx="14" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="580.0" y="115.5" font-size="20">let ticketPrice = basePrice</text><text x="580.0" y="143.5" font-size="20">ticketPrice: 24</text><path d="M180 165 L180 255" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 165 L580 255" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="215" font-size="22">ticketPrice += 5</text><rect x="30" y="255" width="300" height="85" rx="14" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="180.0" y="290.5" font-size="20">basePrice: 24</text><text x="180.0" y="318.5" font-size="20">No reassignment</text><rect x="430" y="255" width="300" height="85" rx="14" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="580.0" y="290.5" font-size="20">ticketPrice: 29</text><text x="580.0" y="318.5" font-size="20">Only this binding changes.</text><text x="380" y="385" font-size="20">Assigning a number does not create a live link between the names.</text>
</g></svg>
