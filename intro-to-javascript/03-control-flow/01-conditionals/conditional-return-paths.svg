<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">One Call Takes One Return Path</title><desc id="desc">In the accessLevel example, age at least 18 returns adult; otherwise it returns minor. A return ends the call, so the adult path cannot continue into the minor return.</desc>
<rect width="760" height="410" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="380" y="40" font-size="26" font-weight="bold">One Call Takes One Return Path</text>
<rect x="245" y="85" width="270" height="75" rx="14" fill="#d0bfff" stroke="#1e293b" stroke-width="2"/><text x="380.0" y="129.5" font-size="20">age &gt;= 18 ?</text><path d="M245 122.5 L170 122.5 L170 255" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M515 122.5 L590 122.5 L590 255" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><text x="95" y="205" font-size="22">true</text><text x="665" y="205" font-size="22">false</text><rect x="40" y="255" width="260" height="85" rx="14" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="170.0" y="290.5" font-size="20">return "adult"</text><text x="170.0" y="318.5" font-size="20">Call ends here.</text><rect x="460" y="255" width="260" height="85" rx="14" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="590.0" y="290.5" font-size="20">return "minor"</text><text x="590.0" y="318.5" font-size="20">Call ends here.</text><text x="380" y="385" font-size="20">Example: age 20 takes the left path; age 16 takes the right.</text>
</g></svg>
