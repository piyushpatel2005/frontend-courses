<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 857" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Repeat Until the Index Reaches Length</title>
<desc id="figure-desc">The illustrative array is [2,4,6]. Initialize total and index, check the boundary before every iteration, update, repeat, and return only after the condition fails.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="857" fill="#ffffff"/>
<path d="M240 175.5 L240 224.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M240 355.5 L240 424.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M100.5 470 L35 470 L35 290 L139.5 290" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M339.5 290 L445 290 L445 635 L380.5 635" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="100" y="85" width="280" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<polygon points="240,225 340,290 240,355 140,290" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="100" y="425" width="280" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="100" y="600" width="280" height="70" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Repeat Until the Index Reaches Length</tspan>
</text>
<text x="240" y="122.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Start: [2, 4, 6]</tspan>
</text>
<text x="240" y="145.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">total = 0; i = 0</tspan>
</text>
<text x="240" y="291.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">i &lt; 3?</tspan>
</text>
<text x="240" y="462.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Add numbers[i]</tspan>
</text>
<text x="240" y="485.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Increase i by 1</tspan>
</text>
<text x="240" y="639.9" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Return total: 12</tspan>
</text>
<text x="280" y="395.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="280">Yes</tspan>
</text>
<text x="35" y="533.92" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="35">Repeat</tspan>
</text>
<text x="415" y="265.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="415">No</tspan>
</text>
<text x="240" y="735.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Totals after each visit: 2 → 6 → 12</tspan>
<tspan x="240" dy="20.7">At i = 3, the condition is false.</tspan>
</text>
</svg>
