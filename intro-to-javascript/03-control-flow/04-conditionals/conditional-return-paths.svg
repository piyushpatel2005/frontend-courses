<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 544.5" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">One Call, One Return Path</title>
<desc id="figure-desc">The illustrative accessLevel function returns adult for age at least 18, otherwise minor. Each return ends the call.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="544.5" fill="#ffffff"/>
<path d="M130 160.5 L110 160 L110 284.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M350 160.5 L370 160 L370 284.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<polygon points="240,90 350,160 240,230 130,160" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="0" y="285" width="220" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="260" y="285" width="220" height="100" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">One Call, One Return Path</tspan>
</text>
<text x="240" y="163.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">age &gt;= 18?</tspan>
</text>
<text x="20" y="327.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="20">return &quot;adult&quot;</tspan>
</text>
<text x="110" y="350.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="110">Call ends</tspan>
</text>
<text x="280" y="327.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="280">return &quot;minor&quot;</tspan>
</text>
<text x="370" y="350.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="370">Call ends</tspan>
</text>
<text x="62" y="240.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="62">Yes</tspan>
</text>
<text x="418" y="240.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="418">No</tspan>
</text>
<text x="240" y="445.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">20 takes the adult path; 16 takes the minor path.</tspan>
</text>
</svg>
