<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">A Total Survives Each Iteration</title><desc id="desc">For the illustrative list [2,4,6], the total starts at 0, then becomes 2, 6, and 12. The index reaches 3 and fails the i less than length check, so the function returns 12.</desc>
<rect width="760" height="400" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="380" y="40" font-size="26" font-weight="bold">A Total Survives Each Iteration</text>
<text x="380" y="82" font-size="22">Illustrative list: [2, 4, 6]     Start: total = 0</text><rect x="20" y="120" width="210" height="130" rx="14" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="125.0" y="164.0" font-size="20">i = 0; value = 2</text><text x="125.0" y="192.0" font-size="20">total = 0 + 2</text><text x="125.0" y="220.0" font-size="20">total is now 2</text><path d="M230 185 L275 185" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="120" width="210" height="130" rx="14" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="380.0" y="164.0" font-size="20">i = 1; value = 4</text><text x="380.0" y="192.0" font-size="20">total = 2 + 4</text><text x="380.0" y="220.0" font-size="20">total is now 6</text><path d="M485 185 L530 185" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="120" width="210" height="130" rx="14" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="635.0" y="164.0" font-size="20">i = 2; value = 6</text><text x="635.0" y="192.0" font-size="20">total = 6 + 6</text><text x="635.0" y="220.0" font-size="20">total is now 12</text><text x="380" y="305" font-size="22">Next check: i = 3; 3 &lt; 3 is false.</text><text x="380" y="350" font-size="22">The loop ends. Return total: 12.</text>
</g></svg>
