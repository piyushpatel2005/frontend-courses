<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 772" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">One Dependency, Two Lookups</title>
<desc id="figure-desc">First await event ID 7. Then acts and seats start independently before a combined wait, so their waiting periods can overlap.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="772" fill="#ffffff"/>
<path d="M30.5 135 L0 135 L0 325 L29.5 325" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M449.5 135 L480 135 L480 325 L450.5 325" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M130 375.5 L130 430 L240 430 L240 489.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M350 375.5 L350 430 L240 430 L240 489.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="30" y="85" width="420" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="30" y="275" width="200" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="250" y="275" width="200" height="100" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="30" y="490" width="420" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">One Dependency, Two Lookups</tspan>
</text>
<text x="240" y="127.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Await getEvent()</tspan>
</text>
<text x="240" y="150.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Receive id: 7</tspan>
</text>
<text x="50" y="317.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="50">getActs(7)</tspan>
</text>
<text x="130" y="340.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="130">Pending</tspan>
</text>
<text x="270" y="317.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="270">getSeats(7)</tspan>
</text>
<text x="350" y="340.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="350">Pending</tspan>
</text>
<text x="240" y="532.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Await Promise.all([acts, seats])</tspan>
</text>
<text x="240" y="555.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Build the Summary</tspan>
</text>
<text x="240" y="650.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Start both before the combined await.</tspan>
<tspan x="240" dy="20.7">Promise.all does not start calls for you.</tspan>
</text>
</svg>
