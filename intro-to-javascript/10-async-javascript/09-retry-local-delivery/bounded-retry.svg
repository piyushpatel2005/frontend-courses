<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 862 487" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Retry Only While Budget Remains</title>
<desc id="figure-desc">For a budget of two total attempts, a first rejection permits one retry. Success returns immediately; the final failure is thrown.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="862" height="487" fill="#ffffff"/>
<path d="M270 172 L333 172" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M478 150 L550 117" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M478 194 L550 232" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M667 273 L667 325" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M550 236 L335 236 L335 323 L200 323 L200 218" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="45" y="126" width="225" height="92" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<polygon points="405.5,126 478,176 405.5,226 333,176" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="550" y="79" width="235" height="75" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="550" y="198" width="235" height="75" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="550" y="325" width="235" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="205.75" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="205.75">Retry Only While Budget Remains</tspan>
</text>
<text x="105.97" y="158.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="105.97">Attempt 1 or 2</tspan>
</text>
<text x="81.78" y="194.79" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="500">
<tspan x="81.78">await sendCue()</tspan>
</text>
<text x="363.96" y="181.53" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
<tspan x="363.96">Success?</tspan>
</text>
<text x="584.92" y="119.53" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
<tspan x="584.92">success → return</tspan>
</text>
<text x="564.94" y="235.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="564.94">failure: budget left?</tspan>
</text>
<text x="589.24" y="362.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="589.24">no → throw error</tspan>
</text>
<text x="344.15" y="296.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="344.15">yes → Attempt 2</tspan>
</text>
<text x="207.64" y="425.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="207.64">Budget 2 means two calls total, not two retries.</tspan>
</text>
</svg>
