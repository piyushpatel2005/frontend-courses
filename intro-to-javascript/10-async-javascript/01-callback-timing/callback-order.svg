<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 872 452" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A Timer Waits for the Script</title>
<desc id="figure-desc">Lights and Music are recorded synchronously. The zero-delay timer cannot interrupt the current script; it later records the curtain cue.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="872" height="452" fill="#ffffff"/>
<path d="M222 188 L262 188" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M442 188 L482 188" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M662 188 L672 188" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M737 221 L737 297" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="52" y="155" width="170" height="66" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="272" y="155" width="170" height="66" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="492" y="155" width="170" height="66" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="682" y="155" width="120" height="66" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="530" y="297" width="272" height="70" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="231" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="231">A Timer Waits for the Script</tspan>
</text>
<text x="344.4" y="100.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="344.4">current script</tspan>
</text>
<text x="385.4" y="282.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="385.4">callback runs later</tspan>
</text>
<text x="77.33" y="188.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="77.33">push &quot;Lights&quot;</tspan>
</text>
<text x="292.74" y="188.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="292.74">register timer</tspan>
</text>
<text x="521.92" y="188.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="521.92">push &quot;Music&quot;</tspan>
</text>
<text x="691.51" y="188.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="691.51">script ends</tspan>
</text>
<text x="532.89" y="325.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="532.89">callback: push &quot;Cue: curtain&quot;</tspan>
</text>
<text x="549.36" y="352.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="549.36">then log the recorded order</tspan>
</text>
<text x="108.96" y="390.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="108.96">Zero delay schedules a callback; it does not interrupt synchronous work.</tspan>
</text>
</svg>
