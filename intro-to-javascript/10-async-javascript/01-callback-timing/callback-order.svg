<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">A Timer Waits for the Current Script</title><desc id="desc">The immediate Lights and Music entries finish before the timer appends Cue curtain.</desc>
<rect width="900" height="340" rx="16" fill="#fffbf5"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#1e293b"/></marker></defs>
<text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#1e293b">A Timer Waits for the Current Script</text>
<rect x="40" y="100" width="230" height="100" rx="12" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/>
<text x="155.0" y="143.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Current Script</text>
<text x="155.0" y="170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Push Lights</text>
<rect x="335" y="100" width="230" height="100" rx="12" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/>
<text x="450.0" y="143.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Current Script</text>
<text x="450.0" y="170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Push Music</text>
<rect x="630" y="100" width="230" height="100" rx="12" fill="#99f6e4" stroke="#1e293b" stroke-width="2"/>
<text x="745.0" y="143.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Timer Callback</text>
<text x="745.0" y="170.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Push Cue: curtain</text>
<path d="M270 150 L335 150" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M565 150 L630 150" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1e293b">setTimeout(..., 0) schedules work; it does not interrupt the script.</text>
<text x="450" y="295" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1e293b">Console: Lights | Music | Cue: curtain</text>
</svg>
