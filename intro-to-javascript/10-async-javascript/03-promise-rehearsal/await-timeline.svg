<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 952 497" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Await Pauses This Function</title>
<desc id="figure-desc">readCue starts then waits; its caller continues. The timer fulfills the cue Promise, readCue resumes, and its then handler prints uppercase text.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="952" height="497" fill="#ffffff"/>
<path d="M284 234 L334 234" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M574 291 L634 291" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M634 318 L514 318 L514 306 L285 306" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="45" y="115" width="240" height="295" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="335" y="115" width="240" height="295" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="635" y="115" width="240" height="295" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="284.5" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="284.5">Await Pauses This Function</tspan>
</text>
<text x="131.4" y="97.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="131.4">readCue()</tspan>
</text>
<text x="427.6" y="97.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="427.6">caller</tspan>
</text>
<text x="669" y="97.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="669">timer / handler</tspan>
</text>
<text x="65" y="159.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="65">readCue starts</tspan>
</text>
<text x="65" y="221.79" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="500">
<tspan x="65">await waitForCue(...)</tspan>
</text>
<text x="65" y="341.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="65">readCue resumes</tspan>
</text>
<text x="355" y="221.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="355">continues immediately</tspan>
</text>
<text x="355" y="279.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="355">&quot;Rehearsal requested&quot;</tspan>
</text>
<text x="655" y="279.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="655">timer resolves cue</tspan>
</text>
<text x="655" y="341.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="655">then receives result</tspan>
</text>
<text x="655" y="379.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="655">&quot;Rehearsal:&quot;</tspan>
<tspan x="655" dy="20.4">SOUND CHECK</tspan>
</text>
<text x="288.4" y="198.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="288.4">pause</tspan>
</text>
<text x="213.76" y="435.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="213.76">The caller keeps running; await does not create a thread.</tspan>
</text>
</svg>
