<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 812 422" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A Promise Settles Once</title>
<desc id="figure-desc">A pending Promise either fulfills with a value or rejects with a reason. Handlers run after current synchronous work.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="812" height="422" fill="#ffffff"/>
<path d="M335 173 L212 245" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M445 173 L567 245" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="285" y="83" width="210" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="70" y="245" width="285" height="90" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="425" y="245" width="285" height="90" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="241.5" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="241.5">A Promise Settles Once</tspan>
</text>
<text x="348.42" y="119.14" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="348.42">Pending</tspan>
</text>
<text x="286.32" y="149.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="286.32">executor already started</tspan>
</text>
<text x="160.97" y="280.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="160.97">Fulfilled</tspan>
</text>
<text x="111.7" y="311.79" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="500">
<tspan x="111.7">value: &quot;sound check&quot;</tspan>
</text>
<text x="521.64" y="280.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="521.64">Rejected</tspan>
</text>
<text x="434.84" y="310.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="434.84">reason: Error(&quot;Missing cue&quot;)</tspan>
</text>
<text x="362.46" y="219.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="362.46">either</tspan>
</text>
<text x="135.12" y="360.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="135.12">One outcome, never both; the lower states are alternatives.</tspan>
</text>
</svg>
