<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">A Promise Settles Once</title><desc id="desc">A pending Promise fulfills with a value or rejects with a reason. Later matching handlers run.</desc>
<rect width="900" height="430" rx="16" fill="#fffbf5"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#1e293b"/></marker></defs>
<text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#1e293b">A Promise Settles Once</text>
<rect x="40" y="155" width="210" height="100" rx="12" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/>
<text x="145.0" y="198.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Pending</text>
<text x="145.0" y="225.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Waiting for cue</text>
<rect x="350" y="75" width="230" height="95" rx="12" fill="#99f6e4" stroke="#1e293b" stroke-width="2"/>
<text x="465.0" y="116.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Fulfilled</text>
<text x="465.0" y="143.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">value: sound check</text>
<rect x="350" y="245" width="230" height="95" rx="12" fill="#fed7aa" stroke="#1e293b" stroke-width="2"/>
<text x="465.0" y="286.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">Rejected</text>
<text x="465.0" y="313.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">reason: Missing cue</text>
<rect x="650" y="75" width="210" height="95" rx="12" fill="#99f6e4" stroke="#1e293b" stroke-width="2"/>
<text x="755.0" y="116.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">.then()</text>
<text x="755.0" y="143.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">uses the value</text>
<rect x="650" y="245" width="210" height="95" rx="12" fill="#ddd6fe" stroke="#1e293b" stroke-width="2"/>
<text x="755.0" y="286.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">.catch()</text>
<text x="755.0" y="313.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#1e293b">handles the error</text>
<path d="M250 205 L300 205 L300 122.5 L350 122.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M250 205 L300 205 L300 292.5 L350 292.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 122.5 L650 122.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 292.5 L650 292.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1e293b">The executor starts now. Promise handlers run after current synchronous work.</text>
</svg>
