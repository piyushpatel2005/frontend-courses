<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">Map Lookup and Set Uniqueness</title><desc id="desc">Map roles host and producer map to gold and silver. A Set made from Seoul, Lisbon, Seoul contains two distinct cities.</desc>
<rect width="900" height="400" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="450.0" y="40" font-size="26">Map Lookup and Set Uniqueness</text>
<text x="240" y="90" font-size="22">Map: Keys → Values</text><text x="685" y="90" font-size="22">Set: Distinct Values</text><rect x="40" y="125" width="165" height="64" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="122.5" y="164" font-size="20">host</text><path d="M205 157 L275 157" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="125" width="165" height="64" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="357.5" y="164" font-size="20">gold</text><rect x="40" y="225" width="165" height="64" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="122.5" y="264" font-size="20">producer</text><path d="M205 257 L275 257" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="225" width="165" height="64" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="357.5" y="264" font-size="20">silver</text><rect x="500" y="125" width="350" height="164" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="675" y="173" font-size="20">Seoul</text><text x="675" y="232" font-size="20">Lisbon</text><text x="240" y="345" font-size="20">get(&quot;producer&quot;) → &quot;silver&quot;</text><text x="675" y="330" font-size="18">Input: Seoul, Lisbon, Seoul</text><text x="675" y="365" font-size="20">size → 2</text>
</g></svg>
