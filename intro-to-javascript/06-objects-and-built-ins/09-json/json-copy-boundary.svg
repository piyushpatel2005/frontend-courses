<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 852 462" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Shared Object or JSON Copy?</title>
<desc id="figure-desc">Assignment shares one object. For JSON-safe data, stringify produces text and parse produces a separate object, including nested data.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="852" height="462" fill="#ffffff"/>
<path d="M335 163 L202 235" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M485 163 L617 235" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="275" y="88" width="270" height="75" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="45" y="235" width="315" height="93" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="460" y="235" width="315" height="93" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="227.75" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="227.75">Shared Object or JSON Copy?</tspan>
</text>
<text x="287.87" y="126.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="287.87">recipe: { servings: 4 }</tspan>
</text>
<text x="119.4" y="263.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="119.4">other = recipe</tspan>
</text>
<text x="101.02" y="300.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="101.02">same object, two names</tspan>
</text>
<text x="480.12" y="261.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="480.12">JSON.stringify(recipe) → text</tspan>
</text>
<text x="480.12" y="299.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="480.12">JSON.parse(text) → new object</tspan>
</text>
<text x="150.8" y="400.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="150.8">JSON-safe data only; serialization is not a universal clone.</tspan>
</text>
</svg>
