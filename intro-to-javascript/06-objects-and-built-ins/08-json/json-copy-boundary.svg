<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Shared Reference or JSON Copy?</title><desc id="desc">Assignment gives two names to one object. For JSON-safe data, stringify creates text and parse creates a separate object.</desc>
<rect width="960" height="500" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="480.0" y="40" font-size="26">Shared Reference or JSON Copy?</text>
<rect x="40" y="85" width="180" height="64" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="130" y="124" font-size="20">recipe</text><rect x="40" y="175" width="180" height="64" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="130" y="214" font-size="20">other = recipe</text><rect x="370" y="115" width="235" height="94" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="487.5" y="152" font-size="20">One Shared Object</text><text x="487.5" y="184" font-size="18">servings: 4</text><path d="M220 117 H290 V162 H370 M220 207 H290 V162" fill="none" stroke="#1e293b" stroke-width="2"/><path d="M320 162 L370 162" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><text x="765" y="147" font-size="20">Assignment shares</text><text x="765" y="179" font-size="20">the same object.</text><rect x="40" y="330" width="200" height="85" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="140" y="363" font-size="20">Original</text><text x="140" y="395" font-size="18">servings: 4</text><rect x="380" y="330" width="200" height="85" rx="12" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="480" y="363" font-size="20">JSON Text</text><text x="480" y="395" font-size="18">{&quot;servings&quot;:4}</text><rect x="720" y="330" width="200" height="85" rx="12" fill="#d0bfff" stroke="#1e293b" stroke-width="2"/><text x="820" y="363" font-size="20">Separate Copy</text><text x="820" y="395" font-size="18">servings: 4</text><path d="M240 372.5 L380 372.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 372.5 L720 372.5" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="312" font-size="18">stringify()</text><text x="650" y="312" font-size="18">parse()</text><text x="480" y="470" font-size="20">JSON-safe data only: a round trip creates a separate object.</text>
</g></svg>
