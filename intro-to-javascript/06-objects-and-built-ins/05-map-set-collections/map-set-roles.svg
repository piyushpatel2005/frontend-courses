<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 852 447" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Lookup Keys or Keep Unique Values</title>
<desc id="figure-desc">Map associates host with gold and producer with silver. Set keeps Seoul and Lisbon once despite duplicate input.</desc>
