<tspan x="220.87">→</tspan>
</text>
<text x="270" y="194.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="270">gold</tspan>
</text>
<text x="90" y="261.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
