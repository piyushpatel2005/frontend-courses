<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 532" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A One-Time Fee Stays Outside</title>
<desc id="figure-desc">Illustrative invoice uses session cost 15, setup fee 4 and 2 sessions. Grouping the fee inside the product charges it twice.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="532" fill="#ffffff"/>
<rect x="0" y="90" width="480" height="110" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="0" y="245" width="480" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">A One-Time Fee Stays Outside</tspan>
</text>
<text x="240" y="137.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Fee Repeated by Mistake</tspan>
</text>
<text x="20" y="160.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="20">(15 + 4) * 2 = 38</tspan>
</text>
<text x="240" y="292.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Sessions Repeated, Fee Added Once</tspan>
</text>
<text x="20" y="315.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="20">15 * 2 + 4 = 34</tspan>
</text>
<text x="240" y="410.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Same inputs; different grouping.</tspan>
<tspan x="240" dy="20.7">The one-time fee is not a per-session cost.</tspan>
</text>
</svg>
