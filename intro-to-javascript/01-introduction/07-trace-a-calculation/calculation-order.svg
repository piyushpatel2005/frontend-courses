<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
<title id="title">Grouping Changes What Gets Repeated</title><desc id="desc">A fee inside the parentheses is charged twice. Multiplying the session cost first charges the fee once. Illustrative invoice uses sessionCost 15, setupFee 4, sessions 2.</desc>
<rect width="760" height="410" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="380" y="40" font-size="26" font-weight="bold">Grouping Changes What Gets Repeated</text>
<rect x="30" y="80" width="325" height="85" rx="14" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="192.5" y="115.5" font-size="20">(15 + 4) * 2</text><text x="192.5" y="143.5" font-size="20">Add the fee before repeating</text><rect x="405" y="80" width="325" height="85" rx="14" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="567.5" y="115.5" font-size="20">15 * 2 + 4</text><text x="567.5" y="143.5" font-size="20">Repeat sessions, then add fee</text><path d="M192.5 165 L192.5 205" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><path d="M567.5 165 L567.5 205" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="205" width="325" height="90" rx="14" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="192.5" y="243.0" font-size="20">19 * 2 = 38</text><text x="192.5" y="271.0" font-size="20">The fee was charged twice.</text><rect x="405" y="205" width="325" height="90" rx="14" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="567.5" y="243.0" font-size="20">30 + 4 = 34</text><text x="567.5" y="271.0" font-size="20">The fee was charged once.</text><text x="380" y="355" font-size="20">Same inputs. Different grouping. Different invoice.</text>
</g></svg>
