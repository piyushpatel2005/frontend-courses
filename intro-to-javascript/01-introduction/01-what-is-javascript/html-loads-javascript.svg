<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">How a Page Runs a Script</title><desc id="desc">In a saved web page, the browser reads index.html, follows the script src value to script.js, and runs the code. The learning preview additionally injects edited code.</desc>
<rect width="760" height="460" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="380" y="40" font-size="26" font-weight="bold">How a Page Runs a Script</text>
<rect x="100" y="75" width="560" height="85" rx="14" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="380.0" y="110.5" font-size="20">index.html</text><text x="380.0" y="138.5" font-size="20">&lt;script src="script.js"&gt;&lt;/script&gt;</text><path d="M380 160 L380 200" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="200" width="360" height="75" rx="14" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="380.0" y="244.5" font-size="20">Browser loads script.js</text><path d="M380 275 L380 315" fill="none" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/><rect x="130" y="315" width="500" height="75" rx="14" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="380.0" y="345.5" font-size="20">Run the statements in order</text><text x="380.0" y="373.5" font-size="20">Display the result in the page</text><text x="380" y="435" font-size="20">Saved-page flow: src names the file to load.</text>
</g></svg>
