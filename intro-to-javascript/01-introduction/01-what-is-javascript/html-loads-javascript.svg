<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">How HTML loads an external JavaScript file</title><desc id="desc">The browser reads index.html, finds a script source tag, loads script.js, and runs the code to produce a result.</desc>
  <rect width="900" height="420" fill="#fffdf7"/><g font-family="Comic Sans MS, cursive" fill="#1e1e1e" stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round" text-anchor="middle">
  <text x="450" y="43" font-size="27" stroke="none">Loading an external script</text>
  <rect x="270" y="78" width="360" height="105" rx="18" fill="#a5d8ff"/><text x="450" y="116" font-size="24" stroke="none">index.html</text><text x="450" y="150" font-family="monospace" font-size="16" stroke="none">&lt;script src="script.js"&gt;&lt;/script&gt;</text>
  <path d="M450 188 L450 230" fill="none"/><path d="M450 230 l-9 -14 M450 230 l9 -14" fill="none"/><text x="565" y="216" font-size="16" stroke="none">browser loads the file</text>
  <rect x="315" y="240" width="270" height="78" rx="18" fill="#b2f2bb"/><text x="450" y="275" font-size="24" stroke="none">script.js</text><text x="450" y="302" font-family="monospace" font-size="16" stroke="none">console.log(...)</text>
  <path d="M450 323 L450 350" fill="none"/><path d="M450 350 l-9 -14 M450 350 l9 -14" fill="none"/>
  <rect x="315" y="355" width="270" height="44" rx="14" fill="#fff3bf"/><text x="450" y="384" font-size="18" stroke="none">JavaScript runs a result</text></g>
</svg>