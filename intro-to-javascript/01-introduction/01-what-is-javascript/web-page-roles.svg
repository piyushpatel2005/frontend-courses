<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">HTML, CSS, and JavaScript roles in a web page</title><desc id="desc">HTML, CSS, and JavaScript cards each point downward to a web page card. HTML provides structure, CSS provides appearance, and JavaScript provides logic and behavior.</desc>
  <rect width="760" height="430" fill="#fffdf7"/><g font-family="Comic Sans MS, cursive" fill="#1e1e1e" stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round" text-anchor="middle">
  <text x="380" y="45" font-size="27" stroke="none">Three roles, one web page</text>
  <rect x="30" y="95" width="190" height="105" rx="18" fill="#a5d8ff"/><text x="125" y="135" font-size="24" stroke="none">HTML</text><text x="125" y="168" font-size="16" stroke="none">structure + content</text>
  <rect x="285" y="95" width="190" height="105" rx="18" fill="#d0bfff"/><text x="380" y="135" font-size="24" stroke="none">CSS</text><text x="380" y="168" font-size="16" stroke="none">appearance</text>
  <rect x="540" y="95" width="190" height="105" rx="18" fill="#b2f2bb"/><text x="635" y="135" font-size="22" stroke="none">JavaScript</text><text x="635" y="168" font-size="16" stroke="none">logic + behavior</text>
  <path d="M125 205 L125 260 L380 260 L380 295" fill="none"/><path d="M380 205 L380 295" fill="none"/><path d="M635 205 L635 260 L380 260" fill="none"/><path d="M380 295 l-9 -14 M380 295 l9 -14" fill="none"/>
  <rect x="245" y="300" width="270" height="75" rx="18" fill="#fff3bf"/><text x="380" y="333" font-size="23" stroke="none">a complete web page</text><text x="380" y="360" font-size="16" stroke="none">content, presentation, and behavior</text>
  <text x="380" y="410" font-size="17" stroke="none">This course focuses on JavaScript. DOM work comes later.</text></g>
</svg>