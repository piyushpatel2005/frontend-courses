<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Find a Substring or Check the Whole Input</title><desc id="desc">Without anchors, a digit pattern finds 42 inside room 42 ready. With start and end anchors, only the input 42 matches.</desc>
<rect width="900" height="440" fill="#fffdf7"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e293b"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle">
<text x="450.0" y="40" font-size="26">Find a Substring or Check the Whole Input</text>
<text x="190" y="100" font-size="22">Input</text><text x="500" y="100" font-size="22">/\d+/</text><text x="740" y="100" font-size="22">/^\d+$/</text><rect x="40" y="140" width="300" height="70" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="190" y="183" font-size="20">&quot;room 42 ready&quot;</text><rect x="405" y="140" width="190" height="70" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="500" y="183" font-size="20">true</text><rect x="645" y="140" width="190" height="70" rx="12" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="740" y="183" font-size="20">false</text><rect x="40" y="245" width="300" height="70" rx="12" fill="#a5d8ff" stroke="#1e293b" stroke-width="2"/><text x="190" y="288" font-size="20">&quot;42&quot;</text><rect x="405" y="245" width="190" height="70" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="500" y="288" font-size="20">true</text><rect x="645" y="245" width="190" height="70" rx="12" fill="#c3fae8" stroke="#1e293b" stroke-width="2"/><text x="740" y="288" font-size="20">true</text><text x="500" y="360" font-size="18">Find digits anywhere</text><text x="740" y="360" font-size="18">Digits only</text><text x="450" y="410" font-size="20">Anchors change the scope of the match; they do not clean the input.</text>
</g></svg>
