<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 872 472" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Find Digits or Require Only Digits</title>
<desc id="figure-desc">The unanchored digit pattern finds a digit sequence inside room 42 ready. The anchored pattern requires the entire input to be digits.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="872" height="472" fill="#ffffff"/>
<rect x="145" y="83" width="555" height="55" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="35" y="183" width="372" height="166" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="433" y="183" width="372" height="166" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="285" y="367" width="270" height="40" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="190.5" y="43.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="190.5">Find Digits or Require Only Digits</tspan>
</text>
<text x="36" y="113.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="36">input</tspan>
</text>
<text x="341.47" y="116.27" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" font-weight="600">
<tspan x="341.47">room 42 ready</tspan>
</text>
<text x="113" y="217.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="113">Find digits anywhere</tspan>
</text>
<text x="85.59" y="256.79" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="500">
<tspan x="85.59">/\d+/.test(&quot;room 42 ready&quot;)</tspan>
</text>
<text x="118.94" y="305.66" fill="#059669" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="118.94">true  →  matches &quot;42&quot;</tspan>
</text>
<text x="516.4" y="217.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="516.4">Require whole input</tspan>
</text>
<text x="482.12" y="255.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="482.12">/^\d+$/.test(&quot;room 42 ready&quot;)</tspan>
</text>
<text x="490.48" y="304.79" fill="#d97706" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="490.48">false  →  extra text remains</tspan>
</text>
<text x="302" y="389.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="302">/^\d+$/.test(&quot;42&quot;) → true</tspan>
</text>
</svg>
