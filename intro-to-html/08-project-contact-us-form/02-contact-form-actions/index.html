<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us Form</title>
</head>
<body>
  <h1>Contact Us</h1>

  <form method="post" action="/contact">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />

    <label for="topic">Topic</label>
    <select id="topic" name="topic">
      <option value="booking">Room booking</option>
      <option value="volunteering">Volunteering</option>
      <option value="accessibility">Accessibility request</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5"></textarea>

    <!-- TODO: Step 1: Add the two optional interest checkboxes. -->
    <!-- TODO: Step 2: Add the named, labeled optional phone input. -->
    <!-- TODO: Step 3: Add the two reply-method radios with email and phone values. -->
    <!-- TODO: Step 4: Give both reply radios one shared non-empty name. -->
    <!-- TODO: Step 5: Add required consent with its name and value; leave it unchecked. -->
    <!-- TODO: Step 6: Give both interests visible connected labels. -->
    <!-- TODO: Step 7: Give both reply radios visible connected labels. -->
    <!-- TODO: Step 8: Give consent a visible agreement label. -->

    <button type="submit">Send Message</button>
  </form>
</body>
</html>
