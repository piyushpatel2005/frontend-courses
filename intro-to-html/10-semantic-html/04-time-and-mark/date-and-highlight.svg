<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc" style="background-color:#ffffff">
<title id="title">Readable date and contextual search highlight</title><desc id="desc">The time element shows April 17, 2027 to readers with datetime 2027-04-17 for software. The mark element highlights seeds because it matches a search, not because it is intrinsically important.</desc>
<rect width="800" height="350" fill="#ffffff"/>
<rect x="30" y="23" width="141" height="26" rx="13" fill="#eff6ff"/><text x="100" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">HTML MEANING</text>
<text x="30" y="81" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Meaning beyond appearance</text><text x="30" y="106" font-family="Arial,sans-serif" font-size="15" fill="#475569">Dates carry machine values; highlights depend on context.</text>
<rect x="30" y="130" width="355" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="415" y="130" width="355" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="48" y="150" width="7" height="23" rx="3" fill="#3b82f6"/><text x="68" y="168" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">&lt;time&gt; · event date</text><text x="49" y="195" font-family="Arial,sans-serif" font-size="15" fill="#475569">Visible words for people</text><rect x="49" y="207" width="317" height="43" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="65" y="235" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1a1a2e">April 17, 2027</text><text x="49" y="274" font-family="Arial,sans-serif" font-size="15" fill="#475569">Unambiguous value for software</text><text x="49" y="300" font-family="monospace" font-size="15" font-weight="700" fill="#1d4ed8">datetime="2027-04-17"</text>
<rect x="433" y="150" width="7" height="23" rx="3" fill="#d97706"/><text x="453" y="168" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">&lt;mark&gt; · search match</text><text x="434" y="195" font-family="Arial,sans-serif" font-size="15" fill="#475569">Result for “seeds”</text><rect x="434" y="207" width="317" height="43" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="447" y="235" font-family="Arial,sans-serif" font-size="17" fill="#1a1a2e">Save your</text><rect x="528" y="216" width="52" height="25" rx="5" fill="#fcd34d"/><text x="533" y="235" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">seeds</text><text x="586" y="235" font-family="Arial,sans-serif" font-size="17" fill="#1a1a2e">for spring.</text><text x="434" y="274" font-family="Arial,sans-serif" font-size="15" fill="#475569">Relevant to this search, not &lt;strong&gt;.</text><text x="434" y="300" font-family="monospace" font-size="15" font-weight="700" fill="#b45309">&lt;mark&gt;seeds&lt;/mark&gt;</text>
</svg>
