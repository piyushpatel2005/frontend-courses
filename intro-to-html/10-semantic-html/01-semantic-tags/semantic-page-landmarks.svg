<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title desc">
<title id="title">Semantic Page Nesting</title><desc id="desc">At page level, header contains navigation, main contains article and aside, and footer follows main. This is a nesting diagram, not a CSS layout.</desc>
<rect width="800" height="570" fill="#fffdf7"/>
<g font-family="Arial, sans-serif" fill="#242424" text-anchor="middle">
<text x="400" y="38" font-size="26">Semantic Page Nesting</text>
<rect x="70" y="65" width="660" height="140" rx="14" fill="#a5d8ff" stroke="#242424" stroke-width="2"/>
<text x="400" y="100" font-size="23">&lt;header&gt; Site Introduction</text>
<rect x="100" y="120" width="600" height="60" rx="10" fill="#fff3bf" stroke="#242424" stroke-width="2"/>
<text x="400" y="157" font-size="21">&lt;nav&gt; Navigation Links</text>
<rect x="70" y="225" width="660" height="230" rx="14" fill="#b2f2bb" stroke="#242424" stroke-width="2"/>
<text x="400" y="263" font-size="23">&lt;main&gt; Primary Content</text>
<rect x="100" y="288" width="350" height="135" rx="12" fill="#d0bfff" stroke="#242424" stroke-width="2"/>
<text x="275" y="343" font-size="22">&lt;article&gt;</text><text x="275" y="380" font-size="18">Self-Contained Garden Update</text>
<rect x="475" y="288" width="225" height="135" rx="12" fill="#ffd8a8" stroke="#242424" stroke-width="2"/>
<text x="588" y="343" font-size="22">&lt;aside&gt;</text><text x="588" y="380" font-size="18">Related Links</text>
<rect x="70" y="475" width="660" height="60" rx="12" fill="#c3fae8" stroke="#242424" stroke-width="2"/>
<text x="400" y="512" font-size="21">&lt;footer&gt; Closing Contact Information</text>
<text x="400" y="558" font-size="16">Boxes show containment; HTML alone does not arrange columns.</text>
</g></svg>