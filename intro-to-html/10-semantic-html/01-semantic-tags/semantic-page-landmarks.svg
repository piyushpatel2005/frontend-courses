<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 858.4" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Semantic Page Nesting</title>
<desc id="figure-desc">A page boundary contains a header with navigation, main with an article and related aside, and a following footer. This shows nesting, not a CSS column layout.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="858.4" fill="#ffffff"/>
<rect x="2" y="64" width="516" height="691" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="20" y="75" width="480" height="160" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="45" y="145" width="430" height="65" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<rect x="20" y="265" width="480" height="350" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="45" y="340" width="430" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="45" y="475" width="430" height="110" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="20" y="645" width="480" height="95" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="260" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="260">Semantic Page Nesting</tspan>
</text>
<text x="260" y="114.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="260">&lt;header&gt; Site Introduction</tspan>
</text>
<text x="260" y="183.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="260">&lt;nav&gt; Navigation Links</tspan>
</text>
<text x="260" y="305.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="260">&lt;main&gt; Primary Content</tspan>
</text>
<text x="260" y="377.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="260">&lt;article&gt;</tspan>
</text>
<text x="260" y="415.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="260">Self-contained garden update</tspan>
</text>
<text x="260" y="512.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="260">&lt;aside&gt;</tspan>
</text>
<text x="260" y="550.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="260">Related links</tspan>
</text>
<text x="260" y="679.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="260">&lt;footer&gt;</tspan>
</text>
<text x="260" y="718.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="260">Closing contact information</tspan>
</text>
<text x="260" y="780.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="260">Boxes show containment, not columns.</tspan>
<tspan x="260" dy="20.7">CSS decides the visual layout.</tspan>
</text>
</svg>
