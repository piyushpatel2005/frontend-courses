<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Response Modes</title></head>
<body>
  <h1>Response Modes</h1>
  <form>
    <fieldset><legend>Practice capabilities</legend>
      <label><input type="checkbox" name="mission" value="flight" /> Flight</label>
      <label><input type="checkbox" name="mission" value="shield" /> Shield</label>
      <label><input type="checkbox" name="mission" value="beacon" /> Beacon sight</label>
    </fieldset>
    <fieldset><legend>Training window</legend>
      <label><input type="radio" name="window" value="dawn" checked /> Dawn</label>
      <label><input type="radio" name="window" value="midday" /> Midday</label>
      <label><input type="radio" name="window" value="night" /> Night</label>
    </fieldset>
  </form>
</body>
</html>
