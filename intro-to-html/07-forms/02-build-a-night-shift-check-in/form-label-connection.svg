<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" role="img" aria-labelledby="title desc">
<title id="title">A label connects to a control</title>
<desc id="desc">The label for value email matches the input id email. Clicking Backup email focuses that input. The input name is a separate submission key.</desc>
<rect width="620" height="460" fill="white"/>
<text x="30" y="44" fill="#1a1a2e" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700"><tspan x="30" dy="0">Match for to id</tspan></text>
<text x="30" y="74" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400"><tspan x="30" dy="0">The same value connects the label and input.</tspan></text>
<rect x="30" y="94" width="560" height="178" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="49" y="132" fill="#2563eb" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700"><tspan x="49" dy="0">&lt;label for=&quot;email&quot;&gt;Backup email&lt;/label&gt;</tspan></text>
<text x="49" y="221" fill="#047857" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700"><tspan x="49" dy="0">&lt;input id=&quot;email&quot; name=&quot;email&quot; type=&quot;email&quot;&gt;</tspan></text>
<text x="49" y="180" fill="#7c3aed" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700"><tspan x="49" dy="0">for=&quot;email&quot;  =  id=&quot;email&quot;</tspan></text>
<text x="30" y="312" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700"><tspan x="30" dy="0">In the page</tspan></text>
<text x="46" y="345" fill="#1a1a2e" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700"><tspan x="46" dy="0">Backup email</tspan></text>
<rect x="250" y="317" width="290" height="41" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<path d="M207 337 L241 337" stroke="#047857" stroke-width="2.5" fill="none" marker-end="url(#focus-flow-tip)"/>
<defs><marker id="focus-flow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#047857"/></marker></defs>
<text x="46" y="390" fill="#047857" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="46" dy="0">Click label → focus input</tspan></text>
<rect x="30" y="409" width="560" height="38" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="46" y="434" fill="#b45309" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400"><tspan x="46" dy="0">name=&quot;email&quot; is for submission, not label matching.</tspan></text>
</svg>
