<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Beacon Maintenance</title>
  </head>
  <body>
    <h1>Beacon Maintenance</h1>
    <form>
      <label for="technician">Technician</label>
      <input type="text" name="technician" id="technician" />
      <label for="backup">Backup email</label>
      <input type="email" name="backup" id="backup" />
      <label for="battery">Battery level</label>
      <input type="number" name="battery" id="battery" min="1" max="100" step="1" />
      <label for="service">Service date</label>
      <input type="date" name="service" id="service" />
      <label for="beacon-light">Beacon light</label>
      <input type="color" name="beacon-light" id="beacon-light" value="#5b7cfa" />
      <button type="submit">Save record</button>
    </form>
  </body>
</html>
