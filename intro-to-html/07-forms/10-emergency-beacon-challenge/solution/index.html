<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Emergency Beacon</title>
  </head>
  <body>
    <form action="/emergency-beacon" method="post">
      <label for="beacon-email">Contact email</label>
      <input name="beacon-email" id="beacon-email" type="email" />
      <fieldset>
        <legend>Response channel</legend>
      <label>
        <input type="radio" name="response" value="signal" />
        Signal light
      </label>
      <label>
        <input type="radio" name="response" value="comms" />
        Radio comms
      </label>
      </fieldset>
      <button type="submit">Send beacon</button>
    </form>
  </body>
</html>
