<svg xmlns="http://www.w3.org/2000/svg" width="700" height="285" viewBox="0 0 700 285" role="img" aria-labelledby="title desc"><title id="title">Select option groups</title><desc id="desc">A label names the whole select, and two optgroup labels identify separate sets of choices.</desc><rect width="700" height="285" rx="14" fill="#f5f8fc"/><rect x="24" y="20" width="652" height="245" rx="12" fill="white" stroke="#64748b"/><text x="44" y="50" font-family="sans-serif" font-size="20" fill="#172554">label · Request topic</text><rect x="44" y="65" width="612" height="180" rx="8" fill="#eff6ff"/><text x="65" y="94" font-family="sans-serif" font-size="19">select · one field</text><rect x="65" y="108" width="260" height="115" rx="8" fill="#dbeafe"/><text x="85" y="137" font-family="sans-serif" font-size="18">optgroup · Bookings</text><text x="85" y="174" font-family="sans-serif" font-size="17">option · Room</text><text x="85" y="203" font-family="sans-serif" font-size="17">option · Equipment</text><rect x="345" y="108" width="285" height="115" rx="8" fill="#dcfce7"/><text x="365" y="137" font-family="sans-serif" font-size="18">optgroup · Support</text><text x="365" y="174" font-family="sans-serif" font-size="17">option · Access</text><text x="365" y="203" font-family="sans-serif" font-size="17">option · Volunteer</text></svg>
