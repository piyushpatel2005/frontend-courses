<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">A select label and two option groups</title><desc id="desc">Request topic labels the entire select. Its Bookings and Support optgroup headings are not selectable. Their option children are Room booking, Equipment booking, Accessibility request, and Volunteering.</desc>
<rect width="800" height="460" fill="#ffffff"/>
<rect x="30" y="23" width="130" height="26" rx="13" fill="#eff6ff"/><text x="95" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">HTML FORMS</text>
<text x="30" y="81" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">One field, organized choices</text><text x="30" y="106" font-family="Arial,sans-serif" font-size="15" fill="#475569">The field label and the group headings have different jobs.</text>
<rect x="30" y="123" width="740" height="47" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/><text x="48" y="152" font-family="monospace" font-size="15" font-weight="700" fill="#6d28d9">&lt;label&gt;</text><text x="155" y="152" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Request topic</text><text x="748" y="152" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#475569">names the whole field</text>
<path d="M400 170V197" fill="none" stroke="#64748b" stroke-width="2"/><path d="M395 191l5 6 5-6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="198" width="740" height="235" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="216" width="7" height="23" rx="3" fill="#3b82f6"/><text x="68" y="234" font-family="monospace" font-size="17" font-weight="700" fill="#1d4ed8">&lt;select&gt;</text><text x="748" y="233" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#475569">one menu</text>
<rect x="48" y="251" width="340" height="160" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><rect x="412" y="251" width="340" height="160" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="64" y="279" font-family="monospace" font-size="15" font-weight="700" fill="#1d4ed8">&lt;optgroup label="Bookings"&gt;</text><text x="64" y="307" font-family="Arial,sans-serif" font-size="15" fill="#475569">Group heading · not selectable</text>
<rect x="64" y="320" width="308" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/><rect x="64" y="363" width="308" height="34" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
<text x="75" y="342" font-family="monospace" font-size="15" font-weight="700" fill="#1d4ed8">&lt;option&gt;</text><text x="158" y="342" font-family="Arial,sans-serif" font-size="15" fill="#1a1a2e">Room booking</text><text x="75" y="385" font-family="monospace" font-size="15" font-weight="700" fill="#1d4ed8">&lt;option&gt;</text><text x="158" y="385" font-family="Arial,sans-serif" font-size="15" fill="#1a1a2e">Equipment booking</text>
<text x="428" y="279" font-family="monospace" font-size="15" font-weight="700" fill="#047857">&lt;optgroup label="Support"&gt;</text><text x="428" y="307" font-family="Arial,sans-serif" font-size="15" fill="#475569">Group heading · not selectable</text>
