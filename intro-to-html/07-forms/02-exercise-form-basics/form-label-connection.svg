<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">A form label connected to its input</title>
  <desc id="desc">A simple form shows a label with a for attribute pointing to an email input with the matching id attribute.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#242424"/></marker>
  </defs>
  <rect width="900" height="380" fill="#fffdf7"/>
  <text x="450" y="45" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="28" fill="#242424">A label tells people what an input is for</text>
  <rect x="100" y="92" width="700" height="220" rx="18" fill="#e7f5ff" stroke="#242424" stroke-width="3"/>
  <text x="145" y="135" font-family="Comic Sans MS, cursive" font-size="22" fill="#242424">Sign-up form</text>
  <rect x="160" y="170" width="205" height="55" rx="10" fill="#fff3bf" stroke="#242424" stroke-width="3"/>
  <text x="262" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#242424">label for="email"</text>
  <rect x="530" y="170" width="205" height="55" rx="10" fill="#b2f2bb" stroke="#242424" stroke-width="3"/>
  <text x="632" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#242424">input id="email"</text>
  <path d="M365 197 L530 197" stroke="#242424" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="447" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#242424">matching name</text>
  <text x="450" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#242424">Clicking the label focuses the email field.</text>
</svg>
