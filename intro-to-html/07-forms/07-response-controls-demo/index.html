<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Mission Reply</title></head>
<body>
  <h1>Mission Reply</h1>
  <form>
    <label for="brief">Mission briefing</label><textarea id="brief" rows="4"></textarea>
    <label for="role">Preferred role</label>
    <select id="role"><option value="scout">Scout</option><option value="rescue" selected>Rescue</option><option value="support">Support</option><option value="lead">Lead</option></select>
    <label for="base">Nearest base</label><input id="base" list="bases" />
    <datalist id="bases"><option value="North Tower"><option value="Harbor Watch"><option value="Meridian Station"></datalist>
  </form>
</body>
</html>
