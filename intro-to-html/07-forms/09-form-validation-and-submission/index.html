<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workshop search</title>
</head>
<body>
  <h1>Find a workshop</h1>
  <!-- TODO: Step 1: Set the form method explicitly. -->
  <form action="/workshops">
    <label for="workshop-query">Workshop words (at least 3 characters)</label>
    <!-- TODO: Step 2: Give the search answer its submission key. -->
    <!-- TODO: Step 3: Require at least three characters. -->
    <input id="workshop-query" type="search">
    <!-- TODO: Step 4: Make this the submit action. -->
    <button id="search-action" type="button">Search workshops</button>
    <!-- TODO: Step 5: Make this restore initial values. -->
    <button id="reset-action" type="button">Reset search</button>
  </form>
</body>
</html>
