<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workshop search</title>
</head>
<body>
  <h1>Find a workshop</h1>
  <form action="/workshops" method="get">
    <label for="workshop-query">Workshop words (at least 3 characters)</label>
    <input id="workshop-query" type="search" name="q" required minlength="3">
    <button id="search-action" type="submit">Search workshops</button>
    <button id="reset-action" type="reset">Reset search</button>
  </form>
</body>
</html>
