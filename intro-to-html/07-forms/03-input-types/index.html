<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mission Profile</title>
  </head>
  <body>
    <h1>Mission Profile</h1>
    <form>
      <label for="call-sign">Call sign</label>
      <input type="text" name="call-sign" id="call-sign" />
      <label for="contact">Contact email</label>
      <input type="email" name="contact" id="contact" />
      <label for="energy">Energy level</label>
      <input type="number" name="energy" id="energy" min="1" max="100" step="1" />
      <label for="activation">Mission activation date</label>
      <input type="date" name="activation" id="activation" />
      <label for="glow">Beacon glow</label>
      <input type="color" name="glow" id="glow" value="#5b7cfa" />
      <button type="submit">Save profile</button>
    </form>
  </body>
</html>
