<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 570" role="img" aria-labelledby="title desc">
<title id="title">One player, several resources</title>
<desc id="desc">A video player has a poster attribute for its still image, two alternative nested source files for one clip, and a nested captions track with its VTT file. All files need hosting.</desc>
<rect width="620" height="570" fill="white"/>
<text x="28" y="43" fill="#1a1a2e" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700"><tspan x="28" dy="0">One video, three resource roles</tspan></text>
<rect x="24" y="68" width="572" height="430" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="42" y="106" fill="#2563eb" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="700"><tspan x="42" dy="0">&lt;video controls</tspan></text>
<text x="42" y="141" fill="#b45309" font-family="DejaVu Sans Mono, monospace" font-size="19" font-weight="700"><tspan x="42" dy="0">poster=&quot;hall-welcome.jpg&quot;&gt;</tspan></text>
<text x="42" y="171" fill="#b45309" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400"><tspan x="42" dy="0">still image before playback</tspan></text>
<rect x="54" y="196" width="512" height="158" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="72" y="226" fill="#047857" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700"><tspan x="72" dy="0">SOURCE CHOICES  •  same clip</tspan></text>
<text x="72" y="267" fill="#1a1a2e" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400"><tspan x="72" dy="0">&lt;source src=&quot;hall-welcome.mp4&quot; type=&quot;video/mp4&quot;&gt;</tspan></text>
<text x="72" y="307" fill="#1a1a2e" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400"><tspan x="72" dy="0">&lt;source src=&quot;hall-welcome.webm&quot; type=&quot;video/webm&quot;&gt;</tspan></text>
<text x="72" y="341" fill="#047857" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400"><tspan x="72" dy="0">Browser chooses a supported encoding.</tspan></text>
<rect x="54" y="376" width="512" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="72" y="406" fill="#7c3aed" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700"><tspan x="72" dy="0">CAPTIONS  •  timed speech and sounds</tspan></text>
<text x="72" y="444" fill="#1a1a2e" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400"><tspan x="72" dy="0">&lt;track kind=&quot;captions&quot; src=&quot;hall-welcome-en.vtt&quot;&gt;</tspan></text>
<text x="28" y="540" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400"><tspan x="28" dy="0">Files are examples: host the video, poster, and VTT.</tspan></text>
</svg>
