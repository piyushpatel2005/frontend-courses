<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 592.7" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">An HTML Document</title>
<desc id="figure-desc">The html element contains head for document information and body for page content. The boxes show containment, not CSS layout.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="592.7" fill="#ffffff"/>
<rect x="20" y="75" width="480" height="420" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="45" y="150" width="430" height="125" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<rect x="45" y="300" width="430" height="155" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="260" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="260">An HTML Document</tspan>
</text>
<text x="260" y="115.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="260">&lt;html&gt;</tspan>
</text>
<text x="260" y="188.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="260">&lt;head&gt;</tspan>
</text>
<text x="260" y="222.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="260">Document information</tspan>
<tspan x="260" dy="20.7">Title, encoding, linked files</tspan>
</text>
<text x="260" y="339.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="260">&lt;body&gt;</tspan>
</text>
<text x="260" y="377.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="260">Page content</tspan>
<tspan x="260" dy="20.7">Headings, paragraphs, links</tspan>
</text>
<text x="260" y="535.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="260">Boxes show which element contains another.</tspan>
</text>
</svg>
