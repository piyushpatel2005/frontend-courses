<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Visiting Card Actions</title>
</head>
<body>
  <div class="card">
    <div class="profile">
      <h1>Riya Patel</h1>
      <p>Community map illustrator</p>
      <img src="https://placehold.co/160x160/png?text=Riya" alt="Profile placeholder for Riya Patel" width="160" />
    </div>

    <div class="contact">
      <h2>Contact</h2>
      <ul>
        <li><span>Email:</span> <span>riya@example.com</span></li>
        <li><span>Phone:</span> <span>+1 555 0142</span></li>
        <li><span>City:</span> <span>Toronto</span></li>
      </ul>
    </div>
    <nav aria-label="Contact actions">
      <a href="mailto:riya@example.com">Email Riya</a>
      <a href="tel:+15550142">Call Riya</a>
      <a href="https://example.com/riya-portfolio" target="_blank" rel="noopener noreferrer">View portfolio</a>
      <a href="mailto:riya@example.com?subject=Community%20map">Ask about a map project</a>
    </nav>
  </div>
</body>
</html>
