<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc" style="background-color:#ffffff">
<title id="title">Inline quotation and standalone block quotation</title><desc id="desc">An inline q belongs inside a sentence's p element. A standalone blockquote contains its own p element.</desc>
<rect width="800" height="360" fill="#ffffff"/>
<rect x="30" y="25" width="151" height="26" rx="13" fill="#eff6ff"/><text x="105" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">HTML STRUCTURE</text>
<text x="30" y="82" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">Where does the quotation belong?</text><text x="30" y="108" font-family="Arial,sans-serif" font-size="15" fill="#475569">Choose an inline quote for a sentence, or a block for a separate passage.</text>
<rect x="30" y="131" width="355" height="198" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="415" y="131" width="355" height="198" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="48" y="149" width="7" height="22" rx="3" fill="#3b82f6"/><text x="69" y="166" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Inside a sentence</text><text x="49" y="190" font-family="Arial,sans-serif" font-size="15" fill="#475569">A short quotation is part of a paragraph.</text>
<rect x="49" y="207" width="317" height="88" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="65" y="232" font-family="monospace" font-size="16" font-weight="700" fill="#1d4ed8">&lt;p&gt;</text><text x="65" y="257" font-family="monospace" font-size="15" fill="#1a1a2e">Mina said,</text><rect x="161" y="238" width="196" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/><text x="168" y="257" font-family="monospace" font-size="15" fill="#1d4ed8">&lt;q&gt;short quote&lt;/q&gt;</text><text x="65" y="283" font-family="monospace" font-size="16" font-weight="700" fill="#1d4ed8">&lt;/p&gt;</text><text x="49" y="316" font-family="Arial,sans-serif" font-size="15" fill="#475569">The &lt;q&gt; is a child of &lt;p&gt;.</text>
<rect x="433" y="149" width="7" height="22" rx="3" fill="#059669"/><text x="454" y="166" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">On its own</text><text x="434" y="190" font-family="Arial,sans-serif" font-size="15" fill="#475569">A longer quotation stands apart.</text>
<rect x="434" y="207" width="317" height="88" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/><text x="450" y="232" font-family="monospace" font-size="16" font-weight="700" fill="#047857">&lt;blockquote&gt;</text><rect x="466" y="240" width="261" height="27" rx="6" fill="#ffffff" stroke="#86efac"/><text x="478" y="259" font-family="monospace" font-size="15" fill="#047857">&lt;p&gt;longer quote&lt;/p&gt;</text><text x="450" y="283" font-family="monospace" font-size="16" font-weight="700" fill="#047857">&lt;/blockquote&gt;</text><text x="434" y="316" font-family="Arial,sans-serif" font-size="15" fill="#475569">The &lt;p&gt; is a child of &lt;blockquote&gt;.</text>
</svg>
