<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Repair Café Schedule</title>
  </head>
  <body>
    <h1>Repair Café Schedule</h1>
    <table>
      <caption>Repair café two-day station schedule</caption>
      <thead>
        <tr>
          <th scope="col">Time</th>
          <th scope="col">Day</th>
          <th scope="col">Station</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">10:00</th>
          <td>Saturday</td>
          <td>Bike repair</td>
        </tr>
        <tr>
          <th scope="row">11:00</th>
          <td>Sunday</td>
          <td>Book mending</td>
        </tr>
        <tr>
          <th scope="row">12:00</th>
          <td colspan="2">All stations close for lunch</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
