<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc" style="background-color:#ffffff">
<title id="title">Three table column slots</title><desc id="desc">Inside one colgroup, a first col covers Shelf; a second col with span two covers Screws and Bulbs. Column groups do not replace table headers.</desc>
<rect width="800" height="340" fill="#ffffff"/>
<rect x="30" y="22" width="128" height="26" rx="13" fill="#eff6ff"/><text x="94" y="41" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">HTML TABLES</text>
<text x="30" y="80" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1a1a2e">One group, three column slots</text><text x="30" y="105" font-family="Arial,sans-serif" font-size="15" fill="#475569">A &lt;col&gt; claims one slot unless its span says otherwise.</text>
<rect x="30" y="125" width="740" height="185" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="153" font-family="monospace" font-size="15" font-weight="700" fill="#1a1a2e">&lt;colgroup&gt;</text><text x="750" y="153" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#475569">3 slots total</text>
<path d="M164 220V245 M520 220V232H401V245 M520 232H637V245" fill="none" stroke="#64748b" stroke-width="1.8"/>
<path d="M159 240l5 6 5-6 M396 240l5 6 5-6 M632 240l5 6 5-6" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="50" y="169" width="228" height="51" rx="9" fill="#eff6ff" stroke="#bfdbfe"/><rect x="290" y="169" width="460" height="51" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="65" y="191" font-family="monospace" font-size="16" font-weight="700" fill="#1d4ed8">&lt;col&gt;</text><text x="65" y="209" font-family="Arial,sans-serif" font-size="15" fill="#475569">one slot</text>
<text x="306" y="191" font-family="monospace" font-size="16" font-weight="700" fill="#047857">&lt;col span="2"&gt;</text><text x="306" y="209" font-family="Arial,sans-serif" font-size="15" fill="#475569">two adjacent slots</text>
<rect x="50" y="246" width="228" height="45" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><rect x="290" y="246" width="222" height="45" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/><rect x="524" y="246" width="226" height="45" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="164" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Shelf</text><text x="401" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Screws</text><text x="637" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Bulbs</text>
</svg>
