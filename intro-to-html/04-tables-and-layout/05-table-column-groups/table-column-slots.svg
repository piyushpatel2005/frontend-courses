<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" role="img" aria-labelledby="title desc"><title id="title">Three table column slots</title><desc id="desc">A single col corresponds to the Shelf column; a second col spans the Screws and Bulbs columns.</desc><rect width="700" height="250" rx="14" fill="#f5f8fc"/><text x="30" y="40" fill="#172554" font-family="sans-serif" font-size="20">colgroup · 3 column slots</text><rect x="30" y="60" width="190" height="65" rx="8" fill="#dbeafe"/><text x="50" y="100" font-family="sans-serif" font-size="19">col · 1 slot</text><rect x="230" y="60" width="440" height="65" rx="8" fill="#dcfce7"/><text x="250" y="100" font-family="sans-serif" font-size="19">col span=2 · 2 slots</text><rect x="30" y="145" width="190" height="65" rx="8" fill="#dbeafe"/><text x="50" y="185" font-family="sans-serif" font-size="19">Shelf</text><rect x="230" y="145" width="215" height="65" rx="8" fill="#dcfce7"/><text x="250" y="185" font-family="sans-serif" font-size="19">Screws</text><rect x="455" y="145" width="215" height="65" rx="8" fill="#dcfce7"/><text x="475" y="185" font-family="sans-serif" font-size="19">Bulbs</text></svg>
