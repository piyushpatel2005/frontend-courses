<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">Three Equal Column Tracks</title><desc id="desc">Map, Snacks, and First aid occupy one row of three equal fractional columns. Gaps separate the columns. More items can create additional rows.</desc><rect width="480" height="440" fill="#fffdf7"/><g font-family="system-ui, sans-serif" font-size="20" fill="#1e293b"><text x="240" y="38" text-anchor="middle" font-size="28">Three Equal Column Tracks</text><text x="240" y="82" text-anchor="middle" font-size="28">grid-template-columns:</text><text x="240" y="121" text-anchor="middle" font-size="28">repeat(3, 1fr)</text><text x="100" y="166" text-anchor="middle" font-size="28">1fr</text><rect x="40" y="187" width="120" height="90" rx="8" fill="#e6d9ff" stroke="#1e293b" stroke-width="2"/><text x="100.0" y="241.0" text-anchor="middle" font-size="28">Map</text><text x="240" y="166" text-anchor="middle" font-size="28">1fr</text><rect x="180" y="187" width="120" height="90" rx="8" fill="#e6d9ff" stroke="#1e293b" stroke-width="2"/><text x="240.0" y="241.0" text-anchor="middle" font-size="28">Snacks</text><text x="380" y="166" text-anchor="middle" font-size="28">1fr</text><rect x="320" y="187" width="120" height="90" rx="8" fill="#e6d9ff" stroke="#1e293b" stroke-width="2"/><text x="380.0" y="241.0" text-anchor="middle" font-size="28">First aid</text><text x="170" y="317" text-anchor="middle" font-size="28">gap</text><text x="310" y="317" text-anchor="middle" font-size="28">gap</text><text x="240" y="375" text-anchor="middle" font-size="28">Three columns share the row.</text><text x="240" y="414" text-anchor="middle" font-size="28">More items can start a new row.</text></g></svg>
