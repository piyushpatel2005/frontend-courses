<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" role="img"><title>CSS Grid tracks</title><desc>A three-column grid with labels showing that columns and rows are tracks, while space between them is a gap.</desc><rect width="700" height="250" fill="#fbf8ff"/><g fill="#ded0ff" stroke="#6342a5" stroke-width="3"><rect x="90" y="70" width="145" height="65"/><rect x="275" y="70" width="145" height="65"/><rect x="460" y="70" width="145" height="65"/><rect x="90" y="160" width="145" height="65"/><rect x="275" y="160" width="145" height="65"/><rect x="460" y="160" width="145" height="65"/></g><text x="255" y="35" font-family="sans-serif" font-size="22" fill="#382365">columns are tracks</text><path d="M245 103h25" stroke="#d45a22" stroke-width="4"/><text x="240" y="150" font-family="sans-serif" font-size="18" fill="#8a3211">gap</text><text x="18" y="115" font-family="sans-serif" font-size="19" fill="#382365">rows</text></svg>
