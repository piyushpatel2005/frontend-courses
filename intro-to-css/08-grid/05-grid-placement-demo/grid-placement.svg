<svg xmlns="http://www.w3.org/2000/svg" width="480" height="460" viewBox="0 0 480 460" role="img" aria-labelledby="title desc"><title id="title">Place An Item Between Lines</title><desc id="desc">Map spans from line 1 to line 3, also called -1, in the featured workshop grid. Snacks and First aid fill the next row. Dashed guides mark the lines; sizes are illustrative.</desc><rect width="480" height="460" fill="#fffdf7"/><g font-family="system-ui, sans-serif" font-size="20" fill="#1e293b"><text x="240" y="38" text-anchor="middle" font-size="28">Place an Item Between Lines</text><text x="240" y="85" text-anchor="middle" font-size="28">grid-column: 1 / -1</text><text x="40" y="135" text-anchor="middle" font-size="28">1</text><text x="240" y="135" text-anchor="middle" font-size="28">2</text><text x="433" y="135" text-anchor="middle" font-size="28">3 = -1</text><path d="M40 148 V396" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/><path d="M240 148 V396" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/><path d="M440 148 V396" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 5"/><rect x="40" y="165" width="400" height="85" rx="8" fill="#ffd8a8" stroke="#1e293b" stroke-width="2"/><text x="240.0" y="216.5" text-anchor="middle" font-size="28">Map spans both columns</text><rect x="40" y="294" width="180" height="85" rx="8" fill="#d0bfff" stroke="#1e293b" stroke-width="2"/><text x="130.0" y="345.5" text-anchor="middle" font-size="28">Snacks</text><rect x="260" y="294" width="180" height="85" rx="8" fill="#d0bfff" stroke="#1e293b" stroke-width="2"/><text x="350.0" y="345.5" text-anchor="middle" font-size="28">First aid</text><text x="240" y="435" text-anchor="middle" font-size="28">Two tracks, three lines.</text></g></svg>
