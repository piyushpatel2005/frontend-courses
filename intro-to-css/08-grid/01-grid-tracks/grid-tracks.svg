<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 503" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Three Equal Column Tracks</title>
<desc id="figure-desc">Three fractional columns contain Map, Snacks and First aid. Gaps lie between tracks; additional items can create rows.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="503" fill="#ffffff"/>
<rect x="0" y="225" width="150" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="165" y="225" width="150" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="330" y="225" width="150" height="90" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Three Equal Column Tracks</tspan>
</text>
<text x="0" y="95.01" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700">
<tspan x="0">grid-template-columns:</tspan>
<tspan x="0" dy="27.6">  repeat(3, 1fr)</tspan>
</text>
<text x="75" y="199.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="75">1fr</tspan>
</text>
<text x="75" y="275.39" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="75">Map</tspan>
</text>
<text x="240" y="199.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="240">1fr</tspan>
</text>
<text x="240" y="275.39" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="240">Snacks</tspan>
</text>
<text x="405" y="199.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="405">1fr</tspan>
</text>
<text x="405" y="275.39" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="405">First aid</tspan>
</text>
<text x="240" y="372.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Gaps separate the tracks.</tspan>
</text>
<text x="240" y="422.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">Three columns share the row.</tspan>
<tspan x="240" dy="23">More items can start a new row.</tspan>
</text>
</svg>
