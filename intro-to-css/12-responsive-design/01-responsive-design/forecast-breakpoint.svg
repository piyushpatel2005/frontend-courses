<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 572" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">The Viewport Chooses the Layout</title>
<desc id="figure-desc">At an initial 16px font size, the min-width 40rem condition starts at 640px. A 400px viewport has one column; an 800px viewport has two.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="832" height="572" fill="#ffffff"/>
<rect x="65" y="205" width="300" height="240" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="95" y="270" width="240" height="60" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="95" y="347" width="240" height="60" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="425" y="205" width="310" height="240" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="445" y="290" width="130" height="85" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="585" y="290" width="130" height="85" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<path d="M90 116 L710 116" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M400 92 L400 146" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="146.51" y="42.62" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
<tspan x="146.51">A breakpoint changes the forecast grid</tspan>
</text>
<text x="316.4" y="73.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="316.4">40rem = 640px*</tspan>
</text>
<text x="115.58" y="164.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="115.58">below 640px · one column</tspan>
</text>
<text x="453.12" y="164.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="453.12">640px and up · two columns</tspan>
</text>
<text x="133.05" y="238.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="133.05">400px viewport</tspan>
</text>
<text x="176.53" y="302.53" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
<tspan x="176.53">Morning</tspan>
</text>
<text x="176.81" y="379.53" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">
<tspan x="176.81">Evening</tspan>
</text>
<text x="498.05" y="238.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="498.05">800px viewport</tspan>
</text>
<text x="475.58" y="333.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="475.58">Morning</tspan>
</text>
<text x="615.84" y="333.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="615.84">Evening</tspan>
</text>
<text x="161.44" y="481.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="161.44">@media (min-width: 40rem)  →  repeat(2, 1fr)</tspan>
</text>
<text x="244.68" y="520.05" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500">
<tspan x="244.68">*assuming the usual 16px initial font size</tspan>
</text>
</svg>
