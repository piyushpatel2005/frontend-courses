<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">The Preview Width Chooses The Layout</title><desc id="desc">Illustrative 400px and 800px preview viewports. The garden forecast uses one column below 40rem and two columns at or above 40rem.</desc><rect width="760" height="330" fill="#fffdf7"/><g font-family="Arial, sans-serif" font-size="18" fill="#1e293b"><text x="380.0" y="35" text-anchor="middle" font-size="22">The Preview Width Chooses The Layout</text><rect x="40" y="75" width="240" height="190" rx="10" fill="white" stroke="#2563eb"/><text x="160" y="108" text-anchor="middle">400px preview</text><rect x="65" y="130" width="190" height="45" rx="6" fill="#dbeafe"/><text x="160" y="159" text-anchor="middle">Morning</text><rect x="65" y="190" width="190" height="45" rx="6" fill="#ccfbf1"/><text x="160" y="219" text-anchor="middle">Evening</text><rect x="330" y="75" width="390" height="190" rx="10" fill="white" stroke="#0f766e"/><text x="525" y="108" text-anchor="middle">800px preview</text><rect x="350" y="145" width="165" height="65" rx="6" fill="#dbeafe"/><text x="432" y="184" text-anchor="middle">Morning</text><rect x="535" y="145" width="165" height="65" rx="6" fill="#ccfbf1"/><text x="617" y="184" text-anchor="middle">Evening</text><text x="380" y="306" text-anchor="middle">40rem = 640px with the usual 16px initial font size.</text></g></svg>
