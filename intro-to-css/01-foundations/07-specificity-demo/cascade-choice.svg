<svg xmlns="http://www.w3.org/2000/svg" width="840" height="545" viewBox="0 0 840 545" role="img" aria-labelledby="title desc"><title id="title">Which Color Wins?</title><desc id="desc">In the lesson the ID rule beats a class and element. A separate example shows source order breaking a specificity tie.</desc><rect width="840" height="545" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle"><text x="420" y="42" font-size="28">Which Color Wins?</text><text x="420" y="80" font-size="20">Same stylesheet • ordinary rules • all match the same note</text><rect x="45" y="112" width="750" height="56" rx="10" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/><text x="310" y="148" font-size="23">p { color: gray; }</text><text x="675" y="148" font-size="22">Element</text><rect x="45" y="182" width="750" height="56" rx="10" fill="#fed7aa" stroke="#1e293b" stroke-width="2"/><text x="310" y="218" font-size="23">.highlight { color: orange; }</text><text x="675" y="218" font-size="22">Class</text><rect x="45" y="252" width="750" height="56" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="310" y="288" font-size="23">#intro { color: green; }</text><text x="675" y="288" font-size="22">ID: winner</text><text x="420" y="350" font-size="22">The ID wins even when its rule comes first.</text><rect x="45" y="380" width="750" height="135" rx="10" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="420" y="414" font-size="22">Separate tie example: the same selector twice</text><text x="420" y="457" font-size="23">p { color: gray; }    then    p { color: blue; }</text><text x="420" y="491" font-size="20">With equal priority, the later blue declaration wins.</text></g></svg>
