<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 797" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Which Color Wins?</title>
<desc id="figure-desc">Ordinary unlayered author rules on one paragraph compare specificity; an ID beats a class and element selector. A tied example resolves by later source order.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="797" fill="#ffffff"/>
<rect x="0" y="105" width="480" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="0" y="225" width="480" height="140" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="0" y="385" width="480" height="140" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="0" y="595" width="480" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Which Color Wins?</tspan>
</text>
<text x="240" y="80.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Same note, same ordinary priority</tspan>
</text>
<text x="20" y="137.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="20">p { color: gray; }</tspan>
</text>
<text x="240" y="187.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Element selector</tspan>
</text>
<text x="20" y="257.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="20">.highlight {</tspan>
<tspan x="20" dy="24">  color: orange;</tspan>
<tspan x="20" dy="24">}</tspan>
</text>
<text x="240" y="345.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Class selector</tspan>
</text>
<text x="20" y="417.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="20">#intro {</tspan>
<tspan x="20" dy="24">  color: green;</tspan>
<tspan x="20" dy="24">}</tspan>
</text>
<text x="240" y="505.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">ID selector wins</tspan>
</text>
<text x="240" y="563.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">The ID wins even when written first.</tspan>
</text>
<text x="240" y="631.27" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="240">A Separate Source-Order Tie</tspan>
</text>
<text x="20" y="668.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="20">p { color: gray; }</tspan>
<tspan x="20" dy="24">p { color: blue; }</tspan>
</text>
<text x="240" y="722.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Equal priority and specificity: later blue wins.</tspan>
</text>
</svg>
