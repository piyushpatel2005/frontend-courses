<svg xmlns="http://www.w3.org/2000/svg" width="840" height="485" viewBox="0 0 840 485" role="img" aria-labelledby="title desc"><title id="title">Anatomy of a CSS Rule</title><desc id="desc">The actual h1 rule broken into selector, property and color value.</desc><rect width="840" height="485" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle"><text x="420" y="44" font-size="28">Anatomy of a CSS Rule</text><rect x="45" y="85" width="750" height="90" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/><text x="420" y="142" font-size="32">h1 { color: #1b4d8c; }</text><rect x="45" y="215" width="240" height="160" rx="10" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/><text x="165" y="253" font-size="24">Selector</text><text x="165" y="303" font-size="26">h1</text><text x="165" y="345" font-size="20">Which elements?</text><rect x="300" y="215" width="240" height="160" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="420" y="253" font-size="24">Property</text><text x="420" y="303" font-size="26">color</text><text x="420" y="345" font-size="20">What changes?</text><rect x="555" y="215" width="240" height="160" rx="10" fill="#fed7aa" stroke="#1e293b" stroke-width="2"/><text x="675" y="253" font-size="24">Value</text><text x="675" y="303" font-size="26">#1b4d8c</text><text x="675" y="345" font-size="20">Which color?</text><text x="420" y="417" font-size="20">Braces group declarations. A colon separates property and value.</text><text x="420" y="453" font-size="20">The semicolon ends color: #1b4d8c;</text></g></svg>
