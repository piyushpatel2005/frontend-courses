<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 532" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Anatomy of a CSS Rule</title>
<desc id="figure-desc">Connectors identify h1 as selector, color as property, and #1b4d8c as value. Braces contain the declaration; colon and semicolon separate and end it.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="832" height="532" fill="#ffffff"/>
<rect x="70" y="90" width="660" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="55" y="300" width="214" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="293" y="300" width="214" height="95" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="531" y="300" width="214" height="95" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<path d="M120 148 L120 273 L144 300" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M200 204 L200 276 L385 300" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M350 204 L350 270 L636 300" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<text x="275.37" y="47.49" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">
<tspan x="275.37">Read one CSS rule</tspan>
</text>
<text x="105" y="136.36" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700">
<tspan x="105">h1</tspan>
</text>
<text x="151" y="136.36" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700">
<tspan x="151">{</tspan>
</text>
<text x="145" y="194.36" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700">
<tspan x="145">color</tspan>
</text>
<text x="250" y="194.36" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700">
<tspan x="250">:</tspan>
</text>
<text x="275" y="194.36" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700">
<tspan x="275">#1b4d8c</tspan>
</text>
<text x="425" y="194.36" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700">
<tspan x="425">;</tspan>
</text>
<text x="105" y="244.36" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700">
<tspan x="105">}</tspan>
</text>
<text x="120.91" y="330.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="120.91">Selector</tspan>
</text>
<text x="77.69" y="363.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="77.69">h1 chooses headings</tspan>
</text>
<text x="357.67" y="330.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="357.67">Property</tspan>
</text>
<text x="325.78" y="363.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="325.78">color changes text</tspan>
</text>
<text x="610.53" y="330.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="610.53">Value</tspan>
</text>
<text x="562.66" y="363.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="562.66">#1b4d8c sets blue</tspan>
</text>
<text x="150.45" y="445.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="150.45">{ } group declarations    : separates    ; ends a declaration</tspan>
</text>
</svg>
