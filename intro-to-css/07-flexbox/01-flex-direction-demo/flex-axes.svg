<svg xmlns="http://www.w3.org/2000/svg" width="480" height="950" viewBox="0 0 480 950" role="img" aria-labelledby="title desc"><title id="title">Flex Axes Follow Direction</title><desc id="desc">The same Map, Snacks, and First aid cards in a row and a column. Main-axis arrows follow the card order; cross-axis arrows are perpendicular. Card sizes are illustrative.</desc><rect width="480" height="950" fill="#fffdf7"/><g font-family="system-ui, sans-serif" font-size="20" fill="#1e293b"><text x="240" y="38" text-anchor="middle" font-size="28">Flex Axes Follow Direction</text><text x="240" y="86" text-anchor="middle" font-size="28">flex-direction: row</text><text x="240" y="131" text-anchor="middle" font-size="28">main axis</text><path d="M60 152 L420 152" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="420,152 408,145 408,159" fill="#2563eb"/><rect x="40" y="180" width="120" height="80" rx="8" fill="#cbe8ff" stroke="#1e293b" stroke-width="2"/><text x="100.0" y="229.0" text-anchor="middle" font-size="28">Map</text><rect x="180" y="180" width="120" height="80" rx="8" fill="#cbe8ff" stroke="#1e293b" stroke-width="2"/><text x="240.0" y="229.0" text-anchor="middle" font-size="28">Snacks</text><rect x="320" y="180" width="120" height="80" rx="8" fill="#cbe8ff" stroke="#1e293b" stroke-width="2"/><text x="380.0" y="229.0" text-anchor="middle" font-size="28">First aid</text><text x="240" y="307" text-anchor="middle" font-size="28">cross axis</text><path d="M240 330 L240 410" fill="none" stroke="#0f766e" stroke-width="3"/><polygon points="240,410 233,398 247,398" fill="#0f766e"/><text x="240" y="467" text-anchor="middle" font-size="28">flex-direction: column</text><text x="240" y="512" text-anchor="middle" font-size="28">cross axis</text><path d="M180 538 L400 538" fill="none" stroke="#0f766e" stroke-width="3"/><polygon points="400,538 388,531 388,545" fill="#0f766e"/><rect x="180" y="565" width="220" height="80" rx="8" fill="#d6f2e9" stroke="#1e293b" stroke-width="2"/><text x="290.0" y="614.0" text-anchor="middle" font-size="28">Map</text><rect x="180" y="675" width="220" height="80" rx="8" fill="#d6f2e9" stroke="#1e293b" stroke-width="2"/><text x="290.0" y="724.0" text-anchor="middle" font-size="28">Snacks</text><rect x="180" y="785" width="220" height="80" rx="8" fill="#d6f2e9" stroke="#1e293b" stroke-width="2"/><text x="290.0" y="834.0" text-anchor="middle" font-size="28">First aid</text><text x="80" y="700" text-anchor="middle" font-size="28">main</text><text x="80" y="733" text-anchor="middle" font-size="28">axis</text><path d="M145 565 L145 865" fill="none" stroke="#2563eb" stroke-width="3"/><polygon points="145,865 138,853 152,853" fill="#2563eb"/><text x="240" y="919" text-anchor="middle" font-size="28">Same order. Different axes.</text></g></svg>
