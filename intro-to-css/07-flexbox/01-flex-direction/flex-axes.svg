<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 905" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Flex Axes Follow Direction</title>
<desc id="figure-desc">For the left-to-right English row the main axis is horizontal and cross axis vertical; a column changes the main axis to vertical and cross axis horizontal. Item order stays Map, Snacks, First aid.</desc>
