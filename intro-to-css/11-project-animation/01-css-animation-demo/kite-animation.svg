<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">One Trip Up, The Next Trip Back</title><desc id="desc">The drift keyframes start at translateY(0), end at translateY(-14px), and alternate back. Each trip lasts two seconds.</desc><rect width="760" height="330" fill="#fffdf7"/><g font-family="Arial, sans-serif" font-size="18" fill="#1e293b"><text x="380.0" y="35" text-anchor="middle" font-size="22">One Trip Up, The Next Trip Back</text><rect x="35" y="85" width="210" height="115" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="140" y="125" text-anchor="middle">from</text><text x="140" y="161" text-anchor="middle">translateY(0)</text><rect x="275" y="85" width="210" height="115" rx="10" fill="#ffedd5" stroke="#c2410c"/><text x="380" y="125" text-anchor="middle">to</text><text x="380" y="161" text-anchor="middle">translateY(-14px)</text><rect x="515" y="85" width="210" height="115" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="620" y="125" text-anchor="middle">alternate returns</text><text x="620" y="161" text-anchor="middle">translateY(0)</text><text x="380" y="246" text-anchor="middle">First trip: 2s upward · Next trip: 2s downward</text><text x="380" y="283" text-anchor="middle">Reduced motion: animation none, kite stays at rest.</text></g></svg>
