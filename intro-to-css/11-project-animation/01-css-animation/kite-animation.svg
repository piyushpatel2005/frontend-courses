<text x="175.48" y="44.62" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
<tspan x="175.48">Two iterations trace one round trip</tspan>
</text>
<text x="210" y="165.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="210">1st: forward</tspan>
</text>
<text x="485" y="165.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="485">2nd: alternate</tspan>
</text>
<text x="79.52" y="325.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="79.52">translateY(0)</tspan>
</text>
<text x="307.83" y="230.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="307.83">translateY(-14px)</tspan>
</text>
<text x="579.52" y="325.66" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="600">
<tspan x="579.52">translateY(0)</tspan>
</text>
<text x="138.43" y="439.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="138.43">0s</tspan>
</text>
<text x="388.43" y="439.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="388.43">2s</tspan>
</text>
<text x="638.43" y="439.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="638.43">4s</tspan>
</text>
<text x="180.34" y="482.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="180.34">drift 2s ease-in-out 2 alternate  →  stop back at rest</tspan>
</text>
<text x="202.88" y="518.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="202.88">prefers-reduced-motion: reduce  →  no animation</tspan>
</text>
</svg>
