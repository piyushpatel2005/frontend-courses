<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 582" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">One Trip Up, One Trip Back</title>
<desc id="figure-desc">A kite follows two 2-second iterations: from translateY(0) to translateY(-14px), then alternate reverses to translateY(0). Reduced motion leaves it at rest.</desc>
