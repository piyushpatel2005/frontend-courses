<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 592" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">An Absolute Pin Uses Its Relative Card</title>
<desc id="figure-desc">The map card is positioned relative; the absolute Today pin is offset 12px from its top and right inner border edges, while normal content remains in flow. Offsets are schematic, not to scale.</desc>
