<text x="194.29" y="46.49" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">
<tspan x="194.29">The card is the pin’s reference</tspan>
</text>
<text x="110" y="135.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="110">.map-card { position: relative; }</tspan>
</text>
<text x="604.63" y="197.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="604.63">Today</tspan>
</text>
<text x="445" y="155.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="445">top: 12px</tspan>
</text>
<text x="575" y="251.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="575">right: 12px</tspan>
</text>
<text x="296.23" y="305.88" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="296.23">Library courtyard</tspan>
</text>
<text x="160.09" y="354.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="160.09">Normal content stays in flow; the pin reserves no space.</tspan>
</text>
<text x="199.84" y="491.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="199.84">.pickup-pin { position: absolute; }</tspan>
</text>
