<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrolling seed notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Seed-storage notes</h1>
    <section class="scroll-panel" aria-label="Storage guide" tabindex="0">
      <h2 class="scroll-heading">Dry before storing</h2>
      <p class="entry">Spread seeds on a dry tray before sealing their envelopes.</p>
      <p class="entry">Label every packet with its variety and collection year.</p>
      <p class="entry">Keep the envelopes in a cool cupboard away from sunlight.</p>
      <p class="entry">Set aside spare packets for the next neighborhood swap.</p>
    </section>
  </main>
</body>
</html>
