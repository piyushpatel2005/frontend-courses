<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc"><title id="title">A Pin Uses Its Card as the Reference</title><desc id="desc">A relative card stays in flow while its absolute pin sits at the top right. The actual offsets are 12px from inner border edges; this diagram is illustrative.</desc><rect width="840" height="500" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle"><text x="420" y="42" font-size="28">A Pin Uses Its Card as the Reference</text><text x="420" y="82" font-size="20">Illustrative placement; offsets are 12px in the code</text><rect x="45" y="120" width="460" height="300" rx="10" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/><text x="215" y="225" font-size="25">.map-card</text><text x="215" y="262" font-size="23">position: relative</text><rect x="337" y="132" width="150" height="58" rx="10" fill="#fed7aa" stroke="#1e293b" stroke-width="2"/><text x="412" y="170" font-size="24">Today</text><text x="260" y="335" font-size="25">Library courtyard</text><text x="270" y="380" font-size="20">Normal content stays in flow.</text><rect x="535" y="120" width="270" height="140" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="670" y="157" font-size="23">.pickup-pin</text><text x="670" y="194" font-size="22">position: absolute</text><text x="670" y="232" font-size="20">No reserved flow space</text><rect x="535" y="290" width="270" height="130" rx="10" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="670" y="329" font-size="24">top: 12px</text><text x="670" y="365" font-size="24">right: 12px</text><text x="670" y="400" font-size="19">From inner border edges</text><text x="420" y="465" font-size="22">The card remains in flow. The pin can overlap content.</text></g></svg>
