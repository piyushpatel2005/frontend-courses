<svg xmlns="http://www.w3.org/2000/svg" width="840" height="525" viewBox="0 0 840 525" role="img" aria-labelledby="title desc"><title id="title">Fit the Box, Then Handle Extra Content</title><desc id="desc">Illustrative short and long cards: a maximum height does not force short content to grow, and overflow auto permits scrolling through long content.</desc><rect width="840" height="525" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle"><text x="420" y="42" font-size="28">Fit the Box, Then Handle Extra Content</text><text x="420" y="80" font-size="20">Illustrative cards • width: 14rem • max-width: 100%</text><rect x="45" y="120" width="355" height="115" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="223" y="161" font-size="25">Short note</text><text x="223" y="203" font-size="22">Fits without scrolling</text><rect x="440" y="120" width="355" height="250" rx="10" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/><text x="600" y="160" font-size="25">Long note</text><text x="600" y="202" font-size="21">The visible area stops</text><text x="600" y="235" font-size="21">at max-height: 7rem.</text><text x="600" y="279" font-size="21">Scroll inside to read</text><text x="600" y="312" font-size="21">the remaining words.</text><rect x="763" y="143" width="12" height="205" rx="10" fill="#e2e8f0" stroke="#1e293b" stroke-width="2"/><rect x="763" y="155" width="12" height="65" rx="10" fill="#fed7aa" stroke="#1e293b" stroke-width="2"/><text x="222" y="283" font-size="22">max-height is a limit,</text><text x="222" y="319" font-size="22">not a required height.</text><rect x="45" y="409" width="750" height="90" rx="10" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="420" y="445" font-size="22">overflow: auto keeps extra text reachable by scrolling.</text><text x="420" y="479" font-size="21">overflow: visible would let it spill outside the box.</text></g></svg>
