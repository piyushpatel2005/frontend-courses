<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seed-swap notice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <header>
      <p class="eyebrow">Riverside Seed Swap</p>
      <h1>Seed-swap notice</h1>
    </header>
    <section class="notice-row" aria-label="Seed-swap notice examples">
      <article class="card">Dry collected seeds thoroughly before storing them. Put each variety in its own envelope and write down the year. Keep the envelopes out of direct sun. If you have extra seeds, set aside a few packets for neighbors.</article>
      <article class="card">Share spare packets.</article>
    </section>
  </main>
</body>
</html>
