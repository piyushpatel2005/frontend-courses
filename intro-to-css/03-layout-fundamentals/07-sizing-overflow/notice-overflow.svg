<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 473.4" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Fit the Box, Then Scroll</title>
<desc id="figure-desc">Short content keeps its natural height; long content reaches max-height 7rem and can scroll with overflow auto. Both examples use width 14rem capped at 100 percent.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="552" height="473.4" fill="#ffffff"/>
<rect x="0" y="120" width="220" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="250" y="120" width="230" height="220" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="461" y="157" width="7" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="461" y="163" width="7" height="44" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Fit the Box, Then Scroll</tspan>
</text>
<text x="240" y="82.4" fill="#1a1a2e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="240">width: 14rem; max-width: 100%</tspan>
</text>
<text x="110" y="162.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="110">Short Note</tspan>
<tspan x="110" dy="23">Fits without scrolling</tspan>
</text>
<text x="365" y="158.14" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
<tspan x="365">Long Note</tspan>
</text>
<text x="365" y="200.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="365">Visible area stops</tspan>
<tspan x="365" dy="20.7">at max-height: 7rem.</tspan>
<tspan x="365" dy="20.7"></tspan>
<tspan x="365" dy="20.7">Scroll inside to read</tspan>
<tspan x="365" dy="20.7">the remaining words.</tspan>
</text>
<text x="110" y="270.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="110">A maximum height</tspan>
<tspan x="110" dy="20.7">is not a forced height.</tspan>
</text>
<text x="240" y="395.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">overflow: auto keeps extra text reachable.</tspan>
<tspan x="240" dy="20.7">overflow: visible lets it paint outside.</tspan>
</text>
</svg>
