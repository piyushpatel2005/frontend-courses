<svg xmlns="http://www.w3.org/2000/svg" width="840" height="530" viewBox="0 0 840 530" role="img" aria-labelledby="title desc"><title id="title">The Seed Packet Box Model</title><desc id="desc">Schematic layers show the lesson values. At 420px border-box width, content is 372px after two 20px padding sides and two 4px borders.</desc><rect width="840" height="530" fill="#fffdf7"/><g font-family="Arial, sans-serif" fill="#1e293b" text-anchor="middle"><text x="420" y="42" font-size="28">The Seed Packet Box Model</text><text x="420" y="79" font-size="20">Schematic layers, not to scale</text><rect x="100" y="106" width="640" height="308" rx="10" fill="#fed7aa" stroke="#1e293b" stroke-width="2"/><text x="420" y="136" font-size="20">Margin: 24px above and below; 0 at the sides</text><rect x="100" y="157" width="640" height="214" rx="10" fill="#ede9fe" stroke="#1e293b" stroke-width="2"/><text x="420" y="187" font-size="22">Border: 4px on every side</text><rect x="144" y="207" width="552" height="144" rx="10" fill="#ccfbf1" stroke="#1e293b" stroke-width="2"/><text x="420" y="239" font-size="22">Padding: 20px on every side</text><rect x="178" y="262" width="484" height="65" rx="10" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/><text x="420" y="303" font-size="24">Content: the packet text</text><text x="420" y="399" font-size="20">Margin stays outside the declared width.</text><text x="420" y="459" font-size="22">Wide-preview example with box-sizing: border-box</text><text x="420" y="497" font-size="22">420px total = 372px content + 40px padding + 8px border</text></g></svg>
