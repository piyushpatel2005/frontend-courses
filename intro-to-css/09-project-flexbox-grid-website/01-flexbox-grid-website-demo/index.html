<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>River radio schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="schedule-layout">
    <header class="schedule-head">
      <h1>River Radio</h1>
      <button type="button">Listen live</button>
    </header>
    <section class="show-grid" aria-label="Today’s shows">
      <article>Morning current</article>
      <article>Lunch loop</article>
      <article>Night tide</article>
    </section>
  </main>
</body>
</html>
