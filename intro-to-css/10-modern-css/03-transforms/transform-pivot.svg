<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 553.27 458.4" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Rotate Paint, Not Layout</title>
<desc id="figure-desc">A rotated note keeps its original layout space. The illustration exaggerates the tilt around its left-center pivot; the actual code rotates minus 3 degrees.</desc>
