<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">A Note Rotates, Its Layout Space Stays</title><desc id="desc">Illustrative note with a left-center pivot, an unchanged dashed layout slot and a rotated outline. The neighboring note stays in place.</desc><rect width="760" height="330" fill="#fffdf7"/><g font-family="Arial, sans-serif" font-size="18" fill="#1e293b"><text x="380.0" y="35" text-anchor="middle" font-size="22">A Note Rotates, Its Layout Space Stays</text><rect x="45" y="105" width="270" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="160" text-anchor="middle">Neighbor stays here</text><rect x="390" y="105" width="270" height="100" fill="none" stroke="#64748b" stroke-dasharray="6 5"/><g transform="rotate(-8 390 155)"><rect x="390" y="105" width="270" height="100" rx="8" fill="#ccfbf1" fill-opacity=".7" stroke="#0f766e"/><text x="525" y="160" text-anchor="middle">Painted note</text></g><circle cx="390" cy="155" r="6" fill="#c2410c"/><text x="380" y="250" text-anchor="middle">Orange dot: left-center pivot</text><text x="380" y="283" text-anchor="middle">Illustration exaggerates the tilt; the demo uses -3deg.</text></g></svg>
