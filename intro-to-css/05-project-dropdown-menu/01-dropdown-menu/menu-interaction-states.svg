<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 492" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A Native Disclosure Toggles</title>
<desc id="figure-desc">Click, tap, Enter or Space on the summary toggles details in both directions. Closed has no open attribute and hidden submenu; expanded has open and visible links.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="832" height="492" fill="#ffffff"/>
<rect x="55" y="110" width="285" height="235" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="90" y="185" width="215" height="55" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="460" y="110" width="285" height="235" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="495" y="174" width="215" height="55" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<rect x="495" y="235" width="215" height="65" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<path d="M355 184 L445 184" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<path d="M445 245 L355 245" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<text x="118.27" y="41.75" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
<tspan x="118.27">The same summary opens and closes details</tspan>
</text>
<text x="154.55" y="148.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="154.55">CLOSED</tspan>
</text>
<text x="169.83" y="218.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="169.83">Stalls</tspan>
</text>
<text x="127.05" y="278.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="127.05">no open attribute</tspan>
</text>
<text x="90.95" y="310.92" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500">
<tspan x="90.95">.submenu: display none</tspan>
</text>
<text x="544.68" y="148.27" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
<tspan x="544.68">EXPANDED</tspan>
</text>
<text x="574.83" y="205.4" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="574.83">Stalls</tspan>
</text>
<text x="516.3" y="269.79" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="516.3">Two navigation links</tspan>
</text>
<text x="511.6" y="328.92" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="511.6">open attribute present</tspan>
</text>
<text x="287.82" y="390.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="287.82">click · tap · Enter · Space</tspan>
</text>
<text x="132.42" y="427.92" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500">
<tspan x="132.42">Pointer exit does not close it; this is navigation, not an ARIA menu.</tspan>
</text>
</svg>
