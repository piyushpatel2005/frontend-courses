<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Two Ways To Keep The Menu Open</title><desc id="desc">Hover and focus-within are alternative conditions. Moving focus from the button to a link keeps focus within the parent.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><rect width="800" height="460" fill="#fffcf5"/><g font-family="Arial, sans-serif" fill="#1e293b" font-size="18"><text x="400" y="38" text-anchor="middle" font-size="24">Two Ways To Keep The Menu Open</text><rect x="35" y="95" width="270" height="85" rx="12" fill="#a5d8ff" stroke="#475569" stroke-width="2"/><text x="170.0" y="130.5" text-anchor="middle">Pointer inside menu</text><text x="170.0" y="156.5" text-anchor="middle">:hover</text><rect x="35" y="265" width="270" height="85" rx="12" fill="#d0bfff" stroke="#475569" stroke-width="2"/><text x="170.0" y="300.5" text-anchor="middle">Button or link focused</text><text x="170.0" y="326.5" text-anchor="middle">:focus-within</text><rect x="485" y="180" width="270" height="85" rx="12" fill="#c3fae8" stroke="#475569" stroke-width="2"/><text x="620.0" y="215.5" text-anchor="middle">Menu stays open</text><text x="620.0" y="241.5" text-anchor="middle">display: block</text><path d="M305 137 H390 V222 H485" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M305 307 H390 V222" fill="none" stroke="#475569" stroke-width="2"/><text x="400" y="390" text-anchor="middle">Either condition opens the menu.</text><text x="400" y="425" text-anchor="middle">Both absent → display: none</text></g></svg>