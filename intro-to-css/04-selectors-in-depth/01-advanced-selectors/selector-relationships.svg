<text x="240" y="40.88" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
<tspan x="240">Child or Descendant?</tspan>
</text>
<text x="240" y="117.4" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="240">main.book-card</tspan>
</text>
<text x="100" y="259.9" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="100">h2</tspan>
<tspan x="100" dy="23">Direct Child</tspan>
</text>
<text x="380" y="259.9" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="380">div.summary</tspan>
<tspan x="380" dy="23">Direct Child</tspan>
</text>
<text x="380" y="424.9" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">
<tspan x="380">p</tspan>
<tspan x="380" dy="23">Nested Descendant</tspan>
</text>
<text x="0" y="371.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="0">.book-card &gt; h2</tspan>
</text>
<text x="100" y="405.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="100">One level down</tspan>
</text>
<text x="0" y="532.4" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600">
<tspan x="0">.book-card p</tspan>
</text>
<text x="240" y="570.66" fill="#1a1a2e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="240">Reaches the paragraph at any depth.</tspan>
</text>
</svg>
