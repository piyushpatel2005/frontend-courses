<path d="M380 310.5 L380 389.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<rect x="130" y="80" width="220" height="65" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="0" y="225" width="200" height="85" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="280" y="225" width="200" height="85" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
