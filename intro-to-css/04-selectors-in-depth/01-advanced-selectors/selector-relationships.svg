<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 552 627.7" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Child or Descendant?</title>
<desc id="figure-desc">Main directly contains h2 and div.summary; p is nested inside the summary. Child selects one level; descendant selects any depth.</desc>
