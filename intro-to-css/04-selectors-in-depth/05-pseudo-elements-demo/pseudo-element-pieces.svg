<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">A Condition, Then A Decorative Piece</title><desc id="desc">The first-child condition selects the first card; before creates a decorative quote before its existing HTML text.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><rect width="800" height="460" fill="#fffcf5"/><g font-family="Arial, sans-serif" fill="#1e293b" font-size="18"><text x="400" y="38" text-anchor="middle" font-size="24">A Condition, Then A Decorative Piece</text><rect x="35" y="85" width="220" height="80" rx="12" fill="#a5d8ff" stroke="#475569" stroke-width="2"/><text x="145.0" y="118.0" text-anchor="middle">.card:first-child</text><text x="145.0" y="144.0" text-anchor="middle">Select an existing card</text><rect x="330" y="85" width="165" height="80" rx="12" fill="#d0bfff" stroke="#475569" stroke-width="2"/><text x="412.5" y="118.0" text-anchor="middle">::before</text><text x="412.5" y="144.0" text-anchor="middle">Generated piece</text><rect x="570" y="85" width="195" height="80" rx="12" fill="#ffd8a8" stroke="#475569" stroke-width="2"/><text x="667.5" y="118.0" text-anchor="middle">content: &quot;“&quot;</text><text x="667.5" y="144.0" text-anchor="middle">Supply the mark</text><path d="M255 125 H330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M495 125 H570" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="95" y="235" width="610" height="110" rx="12" fill="#c3fae8" stroke="#475569" stroke-width="2"/><text x="400.0" y="283.0" text-anchor="middle">“  A poem can make an ordinary walk feel different.</text><text x="400.0" y="309.0" text-anchor="middle">Generated mark + original HTML note</text><text x="400" y="397" text-anchor="middle">:first-child is a condition. ::before is a piece.</text><text x="400" y="428" text-anchor="middle">The second card has no generated mark.</text></g></svg>