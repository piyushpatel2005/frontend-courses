<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Child Or Descendant?</title><desc id="desc">Arrows show direct parent-to-child relationships. The paragraph is a descendant of main, separated by a div wrapper.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#475569"/></marker></defs><rect width="800" height="460" fill="#fffcf5"/><g font-family="Arial, sans-serif" fill="#1e293b" font-size="18"><text x="400" y="38" text-anchor="middle" font-size="24">Child Or Descendant?</text><rect x="275" y="70" width="250" height="64" rx="12" fill="#a5d8ff" stroke="#475569" stroke-width="2"/><text x="400.0" y="108.0" text-anchor="middle">main.book-card</text><rect x="60" y="210" width="230" height="70" rx="12" fill="#ffd8a8" stroke="#475569" stroke-width="2"/><text x="175.0" y="238.0" text-anchor="middle">h2</text><text x="175.0" y="264.0" text-anchor="middle">Direct child</text><rect x="480" y="210" width="250" height="70" rx="12" fill="#c3fae8" stroke="#475569" stroke-width="2"/><text x="605.0" y="238.0" text-anchor="middle">div.summary</text><text x="605.0" y="264.0" text-anchor="middle">Direct child</text><rect x="480" y="350" width="250" height="65" rx="12" fill="#d0bfff" stroke="#475569" stroke-width="2"/><text x="605.0" y="375.5" text-anchor="middle">p</text><text x="605.0" y="401.5" text-anchor="middle">Nested descendant</text><path d="M275 102 H175 V210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M525 102 H605 V210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 280 V350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="345">.book-card &gt; h2</text><text x="65" y="375">reaches the heading.</text><text x="65" y="415">.book-card p reaches the paragraph.</text></g></svg>