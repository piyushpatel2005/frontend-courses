<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 502" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A Condition, Then a Piece</title>
<desc id="figure-desc">The first card matches .card:first-child, so its ::before generated quote appears before the original HTML text. The second card does not match.</desc>
<defs><marker id="arrow-tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5 0 9Z" fill="#64748b"/></marker></defs>
<rect x="-16" y="-16" width="832" height="502" fill="#ffffff"/>
<rect x="70" y="85" width="660" height="85" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="65" y="215" width="325" height="155" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="92" y="270" width="48" height="58" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<rect x="410" y="215" width="325" height="155" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<path d="M265 170 L220 215" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tip)"/>
<text x="166.87" y="42.62" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
<tspan x="166.87">Only the first card gets a CSS quote</tspan>
</text>
<text x="154.09" y="124.53" fill="#1a1a2e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="600">
<tspan x="154.09">.card:first-child::before { content: &quot;“&quot;; }</tspan>
</text>
<text x="123.93" y="243.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="123.93">FIRST CHILD · matches</tspan>
</text>
<text x="108.23" y="299.1" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">
<tspan x="108.23">“</tspan>
</text>
<text x="155" y="292.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="155">A poem can change</tspan>
<tspan x="155" dy="22.5">an ordinary walk.</tspan>
</text>
<text x="451.95" y="243.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="451.95">SECOND CHILD · no match</tspan>
</text>
<text x="452" y="292.66" fill="#1a1a2e" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
<tspan x="452">A poem can change</tspan>
<tspan x="452" dy="22.5">an ordinary walk.</tspan>
</text>
<text x="140.16" y="424.79" fill="#475569" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">
<tspan x="140.16">Gold mark = generated by CSS     ·     Words = original HTML</tspan>
</text>
</svg>
