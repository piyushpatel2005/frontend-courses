<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlit Book Cart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="order-panel">
    <h1>Reserve a night read</h1>
    <ul class="reading-list">
      <li>The Last Lantern</li>
      <li>Map of Small Roads</li>
    </ul>
    <label for="email">Email for pickup notice</label>
    <input class="email" id="email" type="email" placeholder="reader@example.com" />
    <button class="reserve-button">Reserve</button>
  </main>
</body>
</html>
